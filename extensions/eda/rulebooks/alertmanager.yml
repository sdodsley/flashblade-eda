#
# Zero custom code path: the array pushes its own metrics over OTLP into a
# Prometheus OTLP receiver (playbooks/telemetry_setup.yml creates the
# telemetry target and attaches it to the metric policies),
# prometheus/flashblade.rules.yml (generated from the array's policy
# listing by tools/telemetry_rules.py) raises alerts, Alertmanager posts
# them here through the stock ansible.eda.alertmanager source, and the same
# playbooks run. telemetry_array_names (vars) maps the name an array gives
# itself in telemetry (device_name) to its inventory name when they differ;
# an array not in the map is addressed by the label as it is.
# playbooks run. Every rule in that file sets a fixed array_name label (the
# device_name resource attribute Prometheus promotes), because a rulebook
# condition cannot index a label by a variable name.
#
# FlashBladeTelemetrySilent is the rule that watches the pipeline itself:
# a policy's first metric absent for longer than its resolution. The
# playbook decides whether the array, the receiver or the push between
# them is at fault; the alert cannot carry labels from a metric that is
# absent, so the rules file sets array_name on it explicitly, and a silence
# alert without one is paged as it is.
#
# Alertmanager receiver (prometheus/alertmanager.example.yml):
#   receivers:
#     - name: eda
#       webhook_configs:
#         - url: http://<eda host>:5002/alerts
# The source wraps each alert as event.alert with labels, annotations, status.
#
# ansible.eda.alertmanager has no authentication option. The listener binds
# to alertmanager_host (vars); keep that an interface only Alertmanager can
# reach, or put it behind the controller's event streams or a reverse proxy
# with TLS and basic auth (Alertmanager webhook_configs.http_config). Anyone
# who can POST here can raise approval requests.
#
# data_host_path is "" on purpose: the source's default copies a label into
# meta.hosts and ansible-rulebook turns that into the playbook's --limit,
# which skips the localhost plays (notify.yml, capacity_request.yml). With it
# disabled the ruleset's `hosts: all` applies and telemetry_check.yml still
# targets the array named by its target_array extra var.

- name: FlashBlade via Alertmanager
  hosts: all

  sources:
    - ansible.eda.alertmanager:
        host: "{{ alertmanager_host }}"
        port: "{{ alertmanager_port }}"
        data_alerts_path: alerts
        data_host_path: ""
        data_path_separator: .

  rules:
    - name: Telemetry silent - check the pipeline
      condition: >-
        event.alert.status == "firing" and
        event.alert.labels.alertname == "FlashBladeTelemetrySilent" and
        event.alert.labels.array_name is defined
      throttle:
        once_within: 30 minutes
        group_by_attributes:
          - event.alert.labels.array_name
          - event.alert.labels.policy
      action:
        run_playbook:
          name: playbooks/telemetry_check.yml
          extra_vars:
            target_array: "{{ telemetry_array_names[event.alert.labels.array_name | default('')] | default(event.alert.labels.array_name | default('')) }}"
            alert: "{{ event.alert.labels.alertname }}"
            policy: "{{ event.alert.labels.policy | default('') }}"
            started_at: "{{ event.alert.startsAt | default('') }}"
            telemetry_target_name: "{{ telemetry_target_name }}"
            prometheus_url: "{{ prometheus_url }}"
            fb_api_version: "{{ fb_api_version }}"
            alert_log: "{{ alert_log }}"

    # absent_over_time() carries no labels from the series that is missing,
    # so a silence rule without an explicit array_name cannot name a host
    # for the check; it is paged with the labels it has
    - name: Telemetry silent without an array label - notify
      condition: >-
        event.alert.status == "firing" and
        event.alert.labels.alertname == "FlashBladeTelemetrySilent" and
        event.alert.labels.array_name is not defined
      throttle:
        once_within: 30 minutes
        group_by_attributes:
          - event.alert.labels.policy
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: critical
            subject: "FlashBladeTelemetrySilent without an array_name label: {{ event.alert.annotations.summary | default('') }}"
            detail: "policy={{ event.alert.labels.policy | default('') }} labels={{ event.alert.labels }}"
            target_array: ""
            alert_log: "{{ alert_log }}"

    - name: Health not ok - notify
      condition: >-
        event.alert.status == "firing" and
        event.alert.labels.alertname == "FlashBladeHealthNotOk"
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.alert.labels.array_name
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: "{{ event.alert.labels.severity | default('critical') }}"
            subject: "FlashBladeHealthNotOk: {{ event.alert.annotations.summary | default('') }}"
            detail: "labels={{ event.alert.labels }} since {{ event.alert.startsAt | default('') }}"
            target_array: "{{ telemetry_array_names[event.alert.labels.array_name | default('')] | default(event.alert.labels.array_name | default('')) }}"
            alert_log: "{{ alert_log }}"

    - name: Capacity threshold - approval request
      condition: >-
        event.alert.status == "firing" and
        event.alert.labels.alertname == "FlashBladeCapacityHigh"
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.alert.labels.array_name
      action:
        run_playbook:
          name: playbooks/capacity_request.yml
          extra_vars:
            at_risk_array: "{{ telemetry_array_names[event.alert.labels.array_name | default('')] | default(event.alert.labels.array_name | default('')) }}"
            # the rules file puts the bare percentage in annotations.value;
            # summary is the sentence for humans
            used_pct: "{{ event.alert.annotations.value | default('') }}"
            used_bytes: ""
            capacity_bytes: ""
            request_dir: "{{ request_dir }}"
            s3_requests_enabled: "{{ s3_requests_enabled }}"
            object_store: "{{ object_store }}"
            alert_log: "{{ alert_log }}"

    - name: Latency, connector errors or stalled replication - notify
      condition: >-
        event.alert.status == "firing" and
        event.alert.labels.alertname in ["FlashBladeLatencyHigh", "FlashBladeConnectorErrors", "FlashBladeReplicationStalled"]
      throttle:
        once_within: 30 minutes
        group_by_attributes:
          - event.alert.labels.array_name
          - event.alert.labels.alertname
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: "{{ event.alert.labels.severity | default('warning') }}"
            subject: "{{ event.alert.labels.alertname }}: {{ event.alert.annotations.summary | default('') }}"
            detail: "value={{ event.alert.annotations.value | default('') }} labels={{ event.alert.labels }}"
            target_array: "{{ telemetry_array_names[event.alert.labels.array_name | default('')] | default(event.alert.labels.array_name | default('')) }}"
            alert_log: "{{ alert_log }}"

    - name: Any other firing FlashBlade alert - notify
      condition: >-
        event.alert.status == "firing" and
        event.alert.labels.alertname is defined and
        event.alert.labels.alertname not in ["FlashBladeTelemetrySilent", "FlashBladeHealthNotOk", "FlashBladeCapacityHigh", "FlashBladeLatencyHigh", "FlashBladeConnectorErrors", "FlashBladeReplicationStalled"]
      throttle:
        once_within: 30 minutes
        group_by_attributes:
          - event.alert.labels.array_name
          - event.alert.labels.alertname
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: "{{ event.alert.labels.severity | default('warning') }}"
            subject: "{{ event.alert.labels.alertname }}: {{ event.alert.annotations.summary | default('') }}"
            detail: "domain={{ event.alert.labels.domain | default('') }} labels={{ event.alert.labels }}"
            target_array: "{{ telemetry_array_names[event.alert.labels.array_name | default('')] | default(event.alert.labels.array_name | default('')) }}"
            alert_log: "{{ alert_log }}"

    - name: Resolved - log
      condition: event.alert.status == "resolved"
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: info
            subject: >-
              resolved: {{ event.alert.labels.alertname | default('') }}
              on {{ event.alert.labels.array_name | default('') }}
            detail: "{{ event.alert.annotations.summary | default('') }}"
            target_array: "{{ telemetry_array_names[event.alert.labels.array_name | default('')] | default(event.alert.labels.array_name | default('')) }}"
            alert_log: "{{ alert_log }}"
