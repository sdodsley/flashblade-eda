#
# Config drift: poll NTP / DNS / directory service / eradication / admin
# settings on the governed arrays, compare with the baseline in the vars
# file and act.
#
#   NTP, DNS          -> reapply the baseline with everpure.flashblade (idempotent)
#   directory service -> notify only: rewriting the management directory
#                        service needs the bind password and a mistake locks
#                        admins out
#   eradication       -> notify only, always: the setting exists to resist change
#   admin/auth        -> notify only (lockout, login attempts, password length,
#                        SSO, Active Directory membership)
#   data-audit syslog -> notify when require_data_audit_syslog is true and no
#                        syslog server carries the data-audit service: the file
#                        audit stream is silently off
#
# One ruleset = one baseline. Arrays with different baselines get their own
# ruleset (copy this one and point `arrays` at them).

- name: FlashBlade config drift
  hosts: all

  sources:
    - sdodsley.flashblade_eda.purefb_events:
        arrays: "{{ config_arrays | default(purefb_arrays) }}"
        signals: [config]
        config_interval: "{{ config_interval }}"

  rules:
    # A poll that fails once is a blip; one that keeps failing is an array
    # nobody is watching. The first failure of a streak is recorded at info
    # (the alert log; under the default Slack floor), once an hour per array
    # and signal, because health.yml already pages for the array itself and
    # nine rulebooks poll the same arrays; a streak the plugin flags as
    # escalated (poll_error_escalate, default 10 polls) pages at critical once
    # every six hours, since a signal that fails on its own is worth a page.
    # Anything in between is logged below.
    - name: Poll failing for many polls - escalate
      condition: >-
        event.purefb_poll_error is defined and
        event.purefb_poll_error.escalate == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefb_poll_error.array
          - event.purefb_poll_error.signal
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: critical
            subject: "{{ event.purefb_poll_error.array }} {{ event.purefb_poll_error.signal }} poll has failed {{ event.purefb_poll_error.consecutive }} times in a row"
            detail: "{{ event.purefb_poll_error.error }}"
            target_array: "{{ event.purefb_poll_error.array }}"
            alert_log: "{{ alert_log }}"

    - name: Poll failed - notify once
      condition: >-
        event.purefb_poll_error is defined and
        event.purefb_poll_error.consecutive == 1
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_poll_error.array
          - event.purefb_poll_error.signal
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: info
            subject: "{{ event.purefb_poll_error.array }} {{ event.purefb_poll_error.signal }} poll failed"
            detail: "{{ event.purefb_poll_error.error }}"
            target_array: "{{ event.purefb_poll_error.array }}"
            alert_log: "{{ alert_log }}"

    - name: Report poll errors without acting
      condition: event.purefb_poll_error is defined
      action:
        debug:
          msg: "poll failed ({{ event.purefb_poll_error.signal }} on {{ event.purefb_poll_error.array }}): {{ event.purefb_poll_error.error }}"

    - name: NTP drift - reapply baseline
      condition: >-
        event.purefb_config.ntp_servers_csv is defined and
        event.purefb_config.ntp_servers_csv != vars.baseline_ntp_servers_csv
      throttle:
        once_within: 10 minutes   # literal: validated before vars are substituted
        group_by_attributes:
          - event.purefb_config.array
      action:
        run_playbook:
          name: playbooks/remediate_ntp.yml
          extra_vars:
            target_array: "{{ event.purefb_config.array }}"
            observed_ntp_servers: "{{ event.purefb_config.ntp_servers_csv }}"
            baseline_ntp_servers_csv: "{{ baseline_ntp_servers_csv }}"
            alert_log: "{{ alert_log }}"

    - name: DNS drift - reapply baseline
      condition: >-
        event.purefb_config.dns_nameservers_csv is defined and
        (event.purefb_config.dns_nameservers_csv != vars.baseline_dns_nameservers_csv or
         event.purefb_config.dns_domain != vars.baseline_dns_domain)
      throttle:
        once_within: 10 minutes
        group_by_attributes:
          - event.purefb_config.array
      action:
        run_playbook:
          name: playbooks/remediate_dns.yml
          extra_vars:
            target_array: "{{ event.purefb_config.array }}"
            observed_dns_domain: "{{ event.purefb_config.dns_domain }}"
            observed_dns_nameservers: "{{ event.purefb_config.dns_nameservers_csv }}"
            baseline_dns_domain: "{{ baseline_dns_domain }}"
            baseline_dns_nameservers_csv: "{{ baseline_dns_nameservers_csv }}"
            alert_log: "{{ alert_log }}"

    - name: Management directory service drift - notify only
      condition: >-
        event.purefb_config.ds_management_uris_csv is defined and
        (event.purefb_config.ds_management_uris_csv != vars.baseline_ds_management_uris_csv or
         event.purefb_config.ds_management_base_dn != vars.baseline_ds_management_base_dn or
         event.purefb_config.ds_management_enabled != vars.baseline_ds_management_enabled)
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_config.array
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: warning
            subject: "Management directory service drift on {{ event.purefb_config.array }}"
            detail: >-
              enabled={{ event.purefb_config.ds_management_enabled }} uris={{ event.purefb_config.ds_management_uris_csv }}
              base_dn={{ event.purefb_config.ds_management_base_dn }} bind_user={{ event.purefb_config.ds_management_bind_user }};
              baseline enabled={{ baseline_ds_management_enabled }} uris={{ baseline_ds_management_uris_csv }}
              base_dn={{ baseline_ds_management_base_dn }}
            target_array: "{{ event.purefb_config.array }}"
            alert_log: "{{ alert_log }}"

    - name: Eradication settings drift - notify only, never remediate
      condition: >-
        event.purefb_config.manual_eradication is defined and
        (event.purefb_config.manual_eradication != vars.baseline_manual_eradication or
         event.purefb_config.eradication_delay_ms < vars.baseline_min_eradication_delay_ms)
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_config.array
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: critical
            subject: "Eradication settings changed on {{ event.purefb_config.array }}"
            detail: >-
              manual_eradication={{ event.purefb_config.manual_eradication }}
              eradication_delay_ms={{ event.purefb_config.eradication_delay_ms }};
              baseline manual_eradication={{ baseline_manual_eradication }}
              minimum delay={{ baseline_min_eradication_delay_ms }}
            target_array: "{{ event.purefb_config.array }}"
            alert_log: "{{ alert_log }}"

    - name: Admin authentication settings drift - notify only
      condition: >-
        event.purefb_config.max_login_attempts is defined and
        (event.purefb_config.max_login_attempts != vars.baseline_max_login_attempts or
         event.purefb_config.lockout_duration_ms != vars.baseline_lockout_duration_ms or
         event.purefb_config.min_password_length < vars.baseline_min_password_length or
         event.purefb_config.sso_enabled != vars.baseline_sso_enabled)
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_config.array
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: warning
            subject: "Admin authentication settings drift on {{ event.purefb_config.array }}"
            detail: >-
              max_login_attempts={{ event.purefb_config.max_login_attempts }} (baseline {{ baseline_max_login_attempts }})
              lockout_duration_ms={{ event.purefb_config.lockout_duration_ms }} (baseline {{ baseline_lockout_duration_ms }})
              min_password_length={{ event.purefb_config.min_password_length }} (baseline at least {{ baseline_min_password_length }})
              sso_enabled={{ event.purefb_config.sso_enabled }} (baseline {{ baseline_sso_enabled }})
            target_array: "{{ event.purefb_config.array }}"
            alert_log: "{{ alert_log }}"

    # Joining or leaving Active Directory changes who can reach every SMB
    # share; it is a planned change or a problem, never routine.
    - name: Active Directory membership drift - notify only
      condition: >-
        event.purefb_config.ad_joined is defined and
        event.purefb_config.ad_joined != vars.baseline_ad_joined
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_config.array
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: warning
            subject: "Active Directory membership changed on {{ event.purefb_config.array }}"
            detail: "ad_joined={{ event.purefb_config.ad_joined }}; baseline ad_joined={{ baseline_ad_joined }}"
            target_array: "{{ event.purefb_config.array }}"
            alert_log: "{{ alert_log }}"

    - name: No syslog target carries the data-audit service - notify
      condition: >-
        event.purefb_config.syslog_data_audit_servers_csv is defined and
        event.purefb_config.syslog_data_audit_servers_csv == "" and
        vars.require_data_audit_syslog == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefb_config.array
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: warning
            subject: "File audit records from {{ event.purefb_config.array }} go nowhere"
            detail: >-
              no syslog server has the data-audit service (servers: {{ event.purefb_config.syslog_servers_csv }});
              require_data_audit_syslog is true
            target_array: "{{ event.purefb_config.array }}"
            alert_log: "{{ alert_log }}"
