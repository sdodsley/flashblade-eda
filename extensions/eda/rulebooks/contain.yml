#
# Containment: the brakes the array itself offers, each reversible and each
# behind its own switch. client.yml diagnoses and notifies; this rulebook
# acts, on the same telemetry signal, at a higher share
# (contain_min_share_pct) and the same streak logic.
#
# Quarantine: one client holding contain_min_share_pct of the array's ops
#             for contain_consecutive_polls while the array's write latency
#             is baseline_latency_ratio times last week's is made read-only
#             (playbooks/quarantine_client.yml): the client's entry in each
#             legacy NFS rule string it appears in is rewritten rw -> ro, and
#             an export policy that names it gets a `client <ip> permission
#             ro` rule before its first rule. Never a block: the client keeps
#             reading. Addresses in contain_exclude_clients and the array's
#             own addresses are refused; contain_exclude_file_systems globs
#             are left alone. ir_auto_contain false -> a critical notice.
# Tarpit:     a file system holding that share for that many polls gets the
#             QoS policy eda-tarpit at tarpit_ops_per_sec
#             (playbooks/tarpit.yml, sdodsley.flashblade_eda.purefb_qos)
#             when ir_auto_tarpit is true; a file system carrying a policy of
#             its own is left alone and recorded. The policy name is the
#             state: the plugin reports eda_tarpit on every poll for a file
#             system that carries it, so the lift rule always sees it, and
#             the policy is cleared once the share has been normal for
#             contain_release_normal_polls. A tarpit slows every client of
#             that file system, which is why it is a separate switch from
#             the per-object cap in client.yml, and why client.yml keeps the
#             notification when the switch is off.
# Approvals:  the second ruleset is the webhook an operator (or a workflow
#             approval node) posts to with a bearer APPROVAL_TOKEN:
#               {"array": "fb-a", "action": "release" | "quarantine",
#                "client": "<ip>", "file_system": "<optional>", "approver": "jane"}
#               {"array": "fb-a", "action": "release_locks", "client": "<ip>",
#                "file_system": "<optional>", "kind": "sessions" | "locks" | "both"}
#               {"array": "fb-a", "action": "tarpit" | "lift", "file_system": "<fs>",
#                "ops_per_sec": <tarpit only; default tarpit_ops_per_sec>}
#             Each rule accepts only well-formed values: array and approver
#             are plain names ([A-Za-z0-9][A-Za-z0-9_.-]*), client an IPv4 or
#             IPv6 address, file_system a plain name ([A-Za-z0-9][A-Za-z0-9_.:-]*),
#             kind one of sessions, locks or both, and ops_per_sec is read as
#             an integer. A body that fails those shapes runs nothing and is
#             logged by the last rule. Event text is data: the jinja_safe
#             filter on every source keeps template delimiters inert.
#             release_locks runs sdodsley.flashblade_eda.purefb_fs_session
#             (a dead client's NFS and SMB sessions and locks); it is only
#             ever approved, never automatic. Keep locks_port reachable only
#             by approvers; APPROVAL_TOKEN comes from the environment
#             (run.sh --env-vars), never from a vars file.

- name: FlashBlade containment
  hosts: all

  sources:
    - sdodsley.flashblade_eda.purefb_events:
        arrays: "{{ purefb_arrays }}"
        signals: [telemetry]
        telemetry_interval: "{{ telemetry_interval }}"
        client_min_share_pct: "{{ client_min_share_pct }}"
        top_clients: 10
        top_file_systems: 10
        top_buckets: 10
      filters:
        - sdodsley.flashblade_eda.jinja_safe:

  rules:
    # A poll that fails once is a blip; one that keeps failing is an array
    # nobody is watching. The first failure of a streak is recorded at info
    # (the alert log; under the default Slack floor), once an hour per array
    # and signal, because health.yml already pages for the array itself and
    # nine rulebooks poll the same arrays; a streak the plugin flags as
    # escalated (poll_error_escalate, default 10 polls) pages at critical once
    # every six hours, since a signal that fails on its own is worth a page.
    # Anything in between is logged below.
    - name: Poll failing for many polls - escalate
      condition: >-
        event.purefb_poll_error is defined and
        event.purefb_poll_error.escalate == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefb_poll_error.array
          - event.purefb_poll_error.signal
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: critical
            subject: "{{ event.purefb_poll_error.array }} {{ event.purefb_poll_error.signal }} poll has failed {{ event.purefb_poll_error.consecutive }} times in a row"
            detail: "{{ event.purefb_poll_error.error }}"
            target_array: "{{ event.purefb_poll_error.array }}"
            alert_log: "{{ alert_log }}"

    - name: Poll failed - notify once
      condition: >-
        event.purefb_poll_error is defined and
        event.purefb_poll_error.consecutive == 1
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_poll_error.array
          - event.purefb_poll_error.signal
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: info
            subject: "{{ event.purefb_poll_error.array }} {{ event.purefb_poll_error.signal }} poll failed"
            detail: "{{ event.purefb_poll_error.error }}"
            target_array: "{{ event.purefb_poll_error.array }}"
            alert_log: "{{ alert_log }}"

    - name: Report poll errors without acting
      condition: event.purefb_poll_error is defined
      action:
        debug:
          msg: "poll failed ({{ event.purefb_poll_error.signal }} on {{ event.purefb_poll_error.array }}): {{ event.purefb_poll_error.error }}"

    # file_system is empty on purpose: the playbook quarantines the client
    # in every live file system whose export names it, minus the excluded
    # globs, and records which ones it touched
    - name: Client holding the array - quarantine
      condition: >-
        event.purefb_client_performance.high_share_polls is defined and
        event.purefb_client_performance.high_share_polls >= vars.contain_consecutive_polls and
        event.purefb_client_performance.ops_share_pct >= vars.contain_min_share_pct and
        event.purefb_client_performance.baseline_known == true and
        event.purefb_client_performance.array_write_latency_ratio >= vars.baseline_latency_ratio and
        vars.ir_auto_contain == true
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_client_performance.array
          - event.purefb_client_performance.client
      action:
        run_playbook:
          name: playbooks/quarantine_client.yml
          extra_vars:
            target_array: "{{ event.purefb_client_performance.array }}"
            client: "{{ event.purefb_client_performance.client }}"
            file_system: ""
            action: quarantine
            reason: >-
              {{ event.purefb_client_performance.protocol }} client held {{ event.purefb_client_performance.ops_share_pct }}% of the ops
              (iops={{ event.purefb_client_performance.reads_per_sec }}r/{{ event.purefb_client_performance.writes_per_sec }}w)
              for {{ event.purefb_client_performance.high_share_polls }} polls while the array's write latency was
              {{ event.purefb_client_performance.array_write_latency_ratio }}x the same half hour last week
            contain_exclude_clients: "{{ contain_exclude_clients }}"
            contain_exclude_file_systems: "{{ contain_exclude_file_systems }}"
            fb_api_version: "{{ fb_api_version }}"
            alert_log: "{{ alert_log }}"

    - name: Client holding the array - notify
      condition: >-
        event.purefb_client_performance.high_share_polls is defined and
        event.purefb_client_performance.high_share_polls >= vars.contain_consecutive_polls and
        event.purefb_client_performance.ops_share_pct >= vars.contain_min_share_pct and
        event.purefb_client_performance.baseline_known == true and
        event.purefb_client_performance.array_write_latency_ratio >= vars.baseline_latency_ratio and
        vars.ir_auto_contain == false
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_client_performance.array
          - event.purefb_client_performance.client
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: critical
            subject: "Client {{ event.purefb_client_performance.client }} is holding {{ event.purefb_client_performance.ops_share_pct }}% of the ops on {{ event.purefb_client_performance.array }}"
            detail: >-
              iops={{ event.purefb_client_performance.reads_per_sec }}r/{{ event.purefb_client_performance.writes_per_sec }}w
              write={{ event.purefb_client_performance.usec_per_write_op }}us
              for {{ event.purefb_client_performance.high_share_polls }} polls;
              array write={{ event.purefb_client_performance.array_usec_per_write_op }}us,
              {{ event.purefb_client_performance.array_write_latency_ratio }}x the same half hour last week;
              ir_auto_contain is off
            target_array: "{{ event.purefb_client_performance.array }}"
            alert_log: "{{ alert_log }}"

    # eda_capped (an eda-cap-<name> policy from client.yml) and eda_tarpit
    # are distinct: a file system already capped is not tarpitted on top
    - name: File system hogging - tarpit
      condition: >-
        event.purefb_fs_performance.high_share_polls is defined and
        event.purefb_fs_performance.high_share_polls >= vars.contain_consecutive_polls and
        event.purefb_fs_performance.ops_share_pct >= vars.contain_min_share_pct and
        event.purefb_fs_performance.eda_capped == false and
        event.purefb_fs_performance.eda_tarpit == false and
        vars.ir_auto_tarpit == true
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_fs_performance.array
          - event.purefb_fs_performance.file_system
      action:
        run_playbook:
          name: playbooks/tarpit.yml
          extra_vars:
            target_array: "{{ event.purefb_fs_performance.array }}"
            file_system: "{{ event.purefb_fs_performance.file_system }}"
            action: apply
            tarpit_ops_per_sec: "{{ tarpit_ops_per_sec }}"
            reason: >-
              iops={{ event.purefb_fs_performance.reads_per_sec }}r/{{ event.purefb_fs_performance.writes_per_sec }}w
              ({{ event.purefb_fs_performance.ops_share_pct }}% of the array) for {{ event.purefb_fs_performance.high_share_polls }} polls
            fb_api_version: "{{ fb_api_version }}"
            alert_log: "{{ alert_log }}"

    - name: Tarpitted file system calm - lift
      condition: >-
        event.purefb_fs_performance.eda_tarpit is defined and
        event.purefb_fs_performance.eda_tarpit == true and
        event.purefb_fs_performance.normal_polls >= vars.contain_release_normal_polls
      throttle:
        once_within: 10 minutes
        group_by_attributes:
          - event.purefb_fs_performance.array
          - event.purefb_fs_performance.file_system
      action:
        run_playbook:
          name: playbooks/tarpit.yml
          extra_vars:
            target_array: "{{ event.purefb_fs_performance.array }}"
            file_system: "{{ event.purefb_fs_performance.file_system }}"
            action: lift
            tarpit_ops_per_sec: "{{ tarpit_ops_per_sec }}"
            reason: "share normal for {{ event.purefb_fs_performance.normal_polls }} polls"
            fb_api_version: "{{ fb_api_version }}"
            alert_log: "{{ alert_log }}"

- name: FlashBlade containment approvals
  hosts: all

  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: "{{ locks_port }}"
        token: "{{ APPROVAL_TOKEN }}"
      filters:
        - sdodsley.flashblade_eda.jinja_safe:

  rules:
    - name: Approved quarantine or release - apply it
      condition: >-
        event.payload.array is defined and
        event.payload.client is defined and
        event.payload.action is defined and
        event.payload.action in ["quarantine", "release"] and
        event.payload.array is match("^[A-Za-z0-9][A-Za-z0-9_.-]*$") and
        event.payload.client is match("^[0-9A-Fa-f.:]+$") and
        (event.payload.file_system is not defined or
         event.payload.file_system is match("^[A-Za-z0-9][A-Za-z0-9_.:-]*$")) and
        (event.payload.approver is not defined or
         event.payload.approver is match("^[A-Za-z0-9][A-Za-z0-9_.-]*$"))
      action:
        run_playbook:
          name: playbooks/quarantine_client.yml
          extra_vars:
            target_array: "{{ event.payload.array }}"
            client: "{{ event.payload.client }}"
            file_system: "{{ event.payload.file_system | default('') }}"
            action: "{{ event.payload.action }}"
            reason: "{{ event.payload.action }} approved by {{ event.payload.approver | default('unknown') }}"
            contain_exclude_clients: "{{ contain_exclude_clients }}"
            contain_exclude_file_systems: "{{ contain_exclude_file_systems }}"
            fb_api_version: "{{ fb_api_version }}"
            alert_log: "{{ alert_log }}"

    - name: Approved lock and session release - run it
      condition: >-
        event.payload.array is defined and
        event.payload.client is defined and
        event.payload.action is defined and
        event.payload.action == "release_locks" and
        event.payload.array is match("^[A-Za-z0-9][A-Za-z0-9_.-]*$") and
        event.payload.client is match("^[0-9A-Fa-f.:]+$") and
        (event.payload.file_system is not defined or
         event.payload.file_system is match("^[A-Za-z0-9][A-Za-z0-9_.:-]*$")) and
        (event.payload.kind is not defined or
         event.payload.kind in ["sessions", "locks", "both"]) and
        (event.payload.approver is not defined or
         event.payload.approver is match("^[A-Za-z0-9][A-Za-z0-9_.-]*$"))
      action:
        run_playbook:
          name: playbooks/release_locks.yml
          extra_vars:
            target_array: "{{ event.payload.array }}"
            client: "{{ event.payload.client }}"
            file_system: "{{ event.payload.file_system | default('') }}"
            kind: "{{ event.payload.kind | default('both') }}"
            approver: "{{ event.payload.approver | default('unknown') }}"
            alert_log: "{{ alert_log }}"

    - name: Approved tarpit - apply it
      condition: >-
        event.payload.array is defined and
        event.payload.file_system is defined and
        event.payload.action is defined and
        event.payload.action == "tarpit" and
        event.payload.array is match("^[A-Za-z0-9][A-Za-z0-9_.-]*$") and
        event.payload.file_system is match("^[A-Za-z0-9][A-Za-z0-9_.:-]*$") and
        (event.payload.approver is not defined or
         event.payload.approver is match("^[A-Za-z0-9][A-Za-z0-9_.-]*$"))
      action:
        run_playbook:
          name: playbooks/tarpit.yml
          extra_vars:
            target_array: "{{ event.payload.array }}"
            file_system: "{{ event.payload.file_system }}"
            action: apply
            tarpit_ops_per_sec: "{{ event.payload.ops_per_sec | default(tarpit_ops_per_sec) | int }}"
            reason: "tarpit approved by {{ event.payload.approver | default('unknown') }}"
            fb_api_version: "{{ fb_api_version }}"
            alert_log: "{{ alert_log }}"

    - name: Approved lift - apply it
      condition: >-
        event.payload.array is defined and
        event.payload.file_system is defined and
        event.payload.action is defined and
        event.payload.action == "lift" and
        event.payload.array is match("^[A-Za-z0-9][A-Za-z0-9_.-]*$") and
        event.payload.file_system is match("^[A-Za-z0-9][A-Za-z0-9_.:-]*$") and
        (event.payload.approver is not defined or
         event.payload.approver is match("^[A-Za-z0-9][A-Za-z0-9_.-]*$"))
      action:
        run_playbook:
          name: playbooks/tarpit.yml
          extra_vars:
            target_array: "{{ event.payload.array }}"
            file_system: "{{ event.payload.file_system }}"
            action: lift
            tarpit_ops_per_sec: "{{ tarpit_ops_per_sec }}"
            reason: "lift approved by {{ event.payload.approver | default('unknown') }}"
            fb_api_version: "{{ fb_api_version }}"
            alert_log: "{{ alert_log }}"

    # Reached by a body with no known action and by one whose action is
    # known but whose array, client, file_system, kind or approver is not
    # well-formed: nothing runs, the fields are logged.
    - name: Malformed containment request - log
      condition: event.payload is defined
      action:
        debug:
          msg: >-
            containment request ignored: array={{ event.payload.array | default('missing') }}
            action={{ event.payload.action | default('missing') }} (quarantine, release, release_locks, tarpit or lift)
            client={{ event.payload.client | default('missing') }} file_system={{ event.payload.file_system | default('missing') }}
            kind={{ event.payload.kind | default('missing') }} approver={{ event.payload.approver | default('missing') }}
