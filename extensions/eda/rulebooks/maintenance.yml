#
# Maintenance windows: the array's own "someone is working here" flag
# (Purity//FB 4.5.2, REST 2.16; one window per array, 1 to 48 hours, which
# suppresses every alert except the customer-controlled ones). Every other
# rulebook reads it as maintenance_active and stops acting while it is set.
#
# The first ruleset is the change-ticket hook: a POST to the webhook with
# {"array": "<inventory name>", "action": "open" | "extend" | "close",
# "hours": <1-48>, "requested_by": "<name>"} opens, extends (a second POST
# replaces the timeout) or deletes the window through
# playbooks/maintenance_window.yml; hours defaults to maintenance_default_hours.
# The webhook needs a bearer token: APPROVAL_TOKEN comes from the environment
# (run.sh --env-vars), the sender adds -H "Authorization: Bearer $APPROVAL_TOKEN".
# The second ruleset watches the audit stream for a window a human opened
# or closed by hand (puremaintenance) and records who did it.

- name: FlashBlade maintenance windows
  hosts: all

  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: "{{ maintenance_port }}"
        token: "{{ APPROVAL_TOKEN }}"

  rules:
    - name: Window request - open, extend or close it
      condition: >-
        event.payload.array is defined and
        event.payload.action is defined and
        event.payload.action in ["open", "extend", "close"]
      action:
        run_playbook:
          name: playbooks/maintenance_window.yml
          extra_vars:
            target_array: "{{ event.payload.array }}"
            window_action: "{{ event.payload.action }}"
            window_hours: "{{ event.payload.hours | default(maintenance_default_hours) }}"
            requested_by: "{{ event.payload.requested_by | default('unknown') }}"
            fb_api_version: "{{ fb_api_version }}"
            alert_log: "{{ alert_log }}"

    - name: Malformed window request - log
      condition: event.payload is defined
      action:
        debug:
          msg: >-
            maintenance request ignored: array={{ event.payload.array | default('missing') }}
            action={{ event.payload.action | default('missing') }} (open, extend or close)

- name: FlashBlade maintenance audit
  hosts: all

  sources:
    - sdodsley.flashblade_eda.purefb_events:
        arrays: "{{ purefb_arrays }}"
        signals: [audits]
        audits_interval: "{{ audits_interval }}"
        automation_users: "{{ automation_users }}"
        automation_user_agents: "{{ automation_user_agents }}"

  rules:
    # A poll that fails once is a blip; one that keeps failing is an array
    # nobody is watching. The first failure of a streak is recorded at info
    # (the alert log; under the default Slack floor), once an hour per array
    # and signal, because health.yml already pages for the array itself and
    # nine rulebooks poll the same arrays; a streak the plugin flags as
    # escalated (poll_error_escalate, default 10 polls) pages at critical once
    # every six hours, since a signal that fails on its own is worth a page.
    # Anything in between is logged below.
    - name: Poll failing for many polls - escalate
      condition: >-
        event.purefb_poll_error is defined and
        event.purefb_poll_error.escalate == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefb_poll_error.array
          - event.purefb_poll_error.signal
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: critical
            subject: "{{ event.purefb_poll_error.array }} {{ event.purefb_poll_error.signal }} poll has failed {{ event.purefb_poll_error.consecutive }} times in a row"
            detail: "{{ event.purefb_poll_error.error }}"
            target_array: "{{ event.purefb_poll_error.array }}"
            alert_log: "{{ alert_log }}"

    - name: Poll failed - notify once
      condition: >-
        event.purefb_poll_error is defined and
        event.purefb_poll_error.consecutive == 1
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_poll_error.array
          - event.purefb_poll_error.signal
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: info
            subject: "{{ event.purefb_poll_error.array }} {{ event.purefb_poll_error.signal }} poll failed"
            detail: "{{ event.purefb_poll_error.error }}"
            target_array: "{{ event.purefb_poll_error.array }}"
            alert_log: "{{ alert_log }}"

    - name: Report poll errors without acting
      condition: event.purefb_poll_error is defined
      action:
        debug:
          msg: "poll failed ({{ event.purefb_poll_error.signal }} on {{ event.purefb_poll_error.array }}): {{ event.purefb_poll_error.error }}"

    # verify: the CLI command behind a GUI or REST window change is logged
    # as puremaintenance on the lab.
    - name: Maintenance window changed by a human - notify
      condition: >-
        event.purefb_audit.command is defined and
        event.purefb_audit.command == "puremaintenance" and
        event.purefb_audit.by_automation == false
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: info
            subject: "{{ event.purefb_audit.user }} ran {{ event.purefb_audit.command }} {{ event.purefb_audit.subcommand }} on {{ event.purefb_audit.array }}"
            detail: "arguments: {{ event.purefb_audit.arguments }} (from {{ event.purefb_audit.ip_address }} over {{ event.purefb_audit.user_interface }}, audit {{ event.purefb_audit.audit_id }})"
            target_array: "{{ event.purefb_audit.array }}"
            alert_log: "{{ alert_log }}"
