# Generated by tools/platform_rulebooks.py from
# extensions/eda/rulebooks/alertmanager.yml; edit that file and regenerate with
#   python tools/platform_rulebooks.py
# The rulesets, sources and rules are the standalone rulebook's, with every
# run_playbook turned into run_job_template against the job template
# aap/seed.yml creates for that playbook (organization aap_organization;
# alert_log, request_dir and baseline_dir come from the templates), the
# project's event sources named by their collection FQCN, and the
# webhook-only and tick-only rulesets left out (event streams, the
# controller workflow and the controller's schedules for the DR drill, the
# showback and the selftest take their place on the platform).
- name: FlashBlade via Alertmanager
  hosts: all
  sources:
    - ansible.eda.alertmanager:
        host: '{{ alertmanager_host }}'
        port: '{{ alertmanager_port }}'
        data_alerts_path: alerts
        data_host_path: ''
        data_path_separator: .
  rules:
    - name: Telemetry silent - check the pipeline
      condition: event.alert.status == "firing" and event.alert.labels.alertname == "FlashBladeTelemetrySilent" and event.alert.labels.array_name is defined
      throttle:
        once_within: 30 minutes
        group_by_attributes:
          - event.alert.labels.array_name
          - event.alert.labels.policy
      action:
        run_job_template:
          name: FlashBlade - telemetry check
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              target_array: '{{ telemetry_array_names[event.alert.labels.array_name | default('''')] | default(event.alert.labels.array_name | default('''')) }}'
              alert: '{{ event.alert.labels.alertname }}'
              policy: '{{ event.alert.labels.policy | default('''') }}'
              started_at: '{{ event.alert.startsAt | default('''') }}'
              telemetry_target_name: '{{ telemetry_target_name }}'
              prometheus_url: '{{ prometheus_url }}'
              fb_api_version: '{{ fb_api_version }}'
    - name: Telemetry silent without an array label - notify
      condition: event.alert.status == "firing" and event.alert.labels.alertname == "FlashBladeTelemetrySilent" and event.alert.labels.array_name is not defined
      throttle:
        once_within: 30 minutes
        group_by_attributes:
          - event.alert.labels.policy
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: 'FlashBladeTelemetrySilent without an array_name label: {{ event.alert.annotations.summary | default('''') }}'
              detail: policy={{ event.alert.labels.policy | default('') }} labels={{ event.alert.labels }}
              target_array: ''
    - name: Health not ok - notify
      condition: event.alert.status == "firing" and event.alert.labels.alertname == "FlashBladeHealthNotOk"
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.alert.labels.array_name
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: '{{ event.alert.labels.severity | default(''critical'') }}'
              subject: 'FlashBladeHealthNotOk: {{ event.alert.annotations.summary | default('''') }}'
              detail: labels={{ event.alert.labels }} since {{ event.alert.startsAt | default('') }}
              target_array: '{{ telemetry_array_names[event.alert.labels.array_name | default('''')] | default(event.alert.labels.array_name | default('''')) }}'
    - name: Capacity threshold - approval request
      condition: event.alert.status == "firing" and event.alert.labels.alertname == "FlashBladeCapacityHigh"
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.alert.labels.array_name
      action:
        run_job_template:
          name: FlashBlade - capacity request
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              at_risk_array: '{{ telemetry_array_names[event.alert.labels.array_name | default('''')] | default(event.alert.labels.array_name | default('''')) }}'
              used_pct: '{{ event.alert.annotations.value | default('''') }}'
              used_bytes: ''
              capacity_bytes: ''
              s3_requests_enabled: '{{ s3_requests_enabled }}'
              object_store: '{{ object_store }}'
    - name: Latency, connector errors or stalled replication - notify
      condition: event.alert.status == "firing" and event.alert.labels.alertname in ["FlashBladeLatencyHigh", "FlashBladeConnectorErrors", "FlashBladeReplicationStalled"]
      throttle:
        once_within: 30 minutes
        group_by_attributes:
          - event.alert.labels.array_name
          - event.alert.labels.alertname
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: '{{ event.alert.labels.severity | default(''warning'') }}'
              subject: '{{ event.alert.labels.alertname }}: {{ event.alert.annotations.summary | default('''') }}'
              detail: value={{ event.alert.annotations.value | default('') }} labels={{ event.alert.labels }}
              target_array: '{{ telemetry_array_names[event.alert.labels.array_name | default('''')] | default(event.alert.labels.array_name | default('''')) }}'
    - name: Any other firing FlashBlade alert - notify
      condition: event.alert.status == "firing" and event.alert.labels.alertname is defined and event.alert.labels.alertname not in ["FlashBladeTelemetrySilent", "FlashBladeHealthNotOk", "FlashBladeCapacityHigh", "FlashBladeLatencyHigh", "FlashBladeConnectorErrors", "FlashBladeReplicationStalled"]
      throttle:
        once_within: 30 minutes
        group_by_attributes:
          - event.alert.labels.array_name
          - event.alert.labels.alertname
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: '{{ event.alert.labels.severity | default(''warning'') }}'
              subject: '{{ event.alert.labels.alertname }}: {{ event.alert.annotations.summary | default('''') }}'
              detail: domain={{ event.alert.labels.domain | default('') }} labels={{ event.alert.labels }}
              target_array: '{{ telemetry_array_names[event.alert.labels.array_name | default('''')] | default(event.alert.labels.array_name | default('''')) }}'
    - name: Resolved - log
      condition: event.alert.status == "resolved"
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: info
              subject: 'resolved: {{ event.alert.labels.alertname | default('''') }} on {{ event.alert.labels.array_name | default('''') }}'
              detail: '{{ event.alert.annotations.summary | default('''') }}'
              target_array: '{{ telemetry_array_names[event.alert.labels.array_name | default('''')] | default(event.alert.labels.array_name | default('''')) }}'
