#
# Generated by tools/platform_rulebooks.py from
# extensions/eda/rulebooks/alerts.yml; edit that file and regenerate with
#   python tools/platform_rulebooks.py
# The rulesets, sources and rules are the standalone rulebook's, with every
# run_playbook turned into run_job_template against the job template
# aap/seed.yml creates for that playbook (organization aap_organization;
# alert_log, request_dir and baseline_dir come from the templates), the
# project's event sources named by their collection FQCN, and the
# webhook-only and tick-only rulesets left out (event streams, the
# controller workflow and the controller's schedules for the DR drill, the
# showback and the selftest take their place on the platform).
- name: FlashBlade alerts
  hosts: all
  sources:
    - sdodsley.flashblade_eda.purefb_events:
        arrays: '{{ purefb_arrays }}'
        signals:
          - alerts
        alerts_interval: '{{ alerts_interval }}'
  rules:
    - name: Poll failing for many polls - escalate
      condition: event.purefb_poll_error is defined and event.purefb_poll_error.escalate == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefb_poll_error.array
          - event.purefb_poll_error.signal
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: '{{ event.purefb_poll_error.array }} {{ event.purefb_poll_error.signal }} poll has failed {{ event.purefb_poll_error.consecutive }} times in a row'
              detail: '{{ event.purefb_poll_error.error }}'
              target_array: '{{ event.purefb_poll_error.array }}'
    - name: Poll failed - notify once
      condition: event.purefb_poll_error is defined and event.purefb_poll_error.consecutive == 1
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_poll_error.array
          - event.purefb_poll_error.signal
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: info
              subject: '{{ event.purefb_poll_error.array }} {{ event.purefb_poll_error.signal }} poll failed'
              detail: '{{ event.purefb_poll_error.error }}'
              target_array: '{{ event.purefb_poll_error.array }}'
    - name: Report poll errors without acting
      condition: event.purefb_poll_error is defined
      action:
        debug:
          msg: 'poll failed ({{ event.purefb_poll_error.signal }} on {{ event.purefb_poll_error.array }}): {{ event.purefb_poll_error.error }}'
    - name: Alert already open at start-up - log only
      condition: event.purefb_alert.transition == "initial"
      action:
        debug:
          msg: 'open at start: {{ event.purefb_alert.array }} #{{ event.purefb_alert.alert_id }} code {{ event.purefb_alert.code }} {{ event.purefb_alert.severity }} {{ event.purefb_alert.summary }}'
    - name: Alert opened during a maintenance window - log only
      condition: event.purefb_alert.transition == "opened" and event.purefb_alert.maintenance_active == true
      action:
        debug:
          msg: 'maintenance window on {{ event.purefb_alert.array }}: alert {{ event.purefb_alert.code }} {{ event.purefb_alert.summary }} not routed'
    - name: Alert opened - route through the runbook map and flag it on the array
      condition: event.purefb_alert.transition == "opened" and event.purefb_alert.maintenance_active == false and vars.alert_flag_handled == true
      actions:
        - run_job_template:
            name: FlashBlade - alert runbook
            organization: '{{ aap_organization }}'
            job_args:
              extra_vars:
                severity: '{{ event.purefb_alert.severity }}'
                transition: opened
                subject: '{{ event.purefb_alert.array }} alert {{ event.purefb_alert.code }}: {{ event.purefb_alert.summary }}'
                component: '{{ event.purefb_alert.component_type }}:{{ event.purefb_alert.component_name }}'
                component_name: '{{ event.purefb_alert.component_name }}'
                array_action: '{{ event.purefb_alert.action }}'
                knowledge_base_url: '{{ event.purefb_alert.knowledge_base_url }}'
                alert_description: '{{ event.purefb_alert.description }}'
                alert_variables: '{{ event.purefb_alert.variables }}'
                target_array: '{{ event.purefb_alert.array }}'
                alert_id: '{{ event.purefb_alert.alert_id }}'
                alert_code: '{{ event.purefb_alert.code }}'
                alert_runbooks: '{{ alert_runbooks }}'
                fb_api_version: '{{ fb_api_version }}'
        - run_job_template:
            name: FlashBlade - flag alert
            organization: '{{ aap_organization }}'
            job_args:
              extra_vars:
                target_array: '{{ event.purefb_alert.array }}'
                alert_id: '{{ event.purefb_alert.alert_id }}'
                alert_code: '{{ event.purefb_alert.code }}'
                fb_api_version: '{{ fb_api_version }}'
    - name: Alert opened - route through the runbook map
      condition: event.purefb_alert.transition == "opened" and event.purefb_alert.maintenance_active == false and vars.alert_flag_handled == false
      action:
        run_job_template:
          name: FlashBlade - alert runbook
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: '{{ event.purefb_alert.severity }}'
              transition: opened
              subject: '{{ event.purefb_alert.array }} alert {{ event.purefb_alert.code }}: {{ event.purefb_alert.summary }}'
              component: '{{ event.purefb_alert.component_type }}:{{ event.purefb_alert.component_name }}'
              component_name: '{{ event.purefb_alert.component_name }}'
              array_action: '{{ event.purefb_alert.action }}'
              knowledge_base_url: '{{ event.purefb_alert.knowledge_base_url }}'
              alert_description: '{{ event.purefb_alert.description }}'
              alert_variables: '{{ event.purefb_alert.variables }}'
              target_array: '{{ event.purefb_alert.array }}'
              alert_id: '{{ event.purefb_alert.alert_id }}'
              alert_code: '{{ event.purefb_alert.code }}'
              alert_runbooks: '{{ alert_runbooks }}'
              fb_api_version: '{{ fb_api_version }}'
    - name: Alert severity raised - notify
      condition: event.purefb_alert.transition == "updated" and event.purefb_alert.severity_raised == true and event.purefb_alert.maintenance_active == false
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: '{{ event.purefb_alert.severity }}'
              subject: '{{ event.purefb_alert.array }} alert {{ event.purefb_alert.code }} raised to {{ event.purefb_alert.severity }}: {{ event.purefb_alert.summary }}'
              detail: was {{ event.purefb_alert.previous_severity }}; {{ event.purefb_alert.action }}
              target_array: '{{ event.purefb_alert.array }}'
              alert_id: '{{ event.purefb_alert.alert_id }}'
              alert_code: '{{ event.purefb_alert.code }}'
    - name: Alert closing - log
      condition: event.purefb_alert.transition == "closing"
      action:
        debug:
          msg: '{{ event.purefb_alert.array }} alert {{ event.purefb_alert.code }} is closing: {{ event.purefb_alert.summary }}'
    - name: Alert closed - notify
      condition: event.purefb_alert.transition == "closed"
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: info
              subject: '{{ event.purefb_alert.array }} alert {{ event.purefb_alert.code }} closed: {{ event.purefb_alert.summary }}'
              detail: open for {{ event.purefb_alert.resolved_after_s }} s; {{ event.purefb_alert.action }}
              target_array: '{{ event.purefb_alert.array }}'
              alert_id: '{{ event.purefb_alert.alert_id }}'
              alert_code: '{{ event.purefb_alert.code }}'
