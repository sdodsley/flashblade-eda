#
# Generated by tools/platform_rulebooks.py from
# extensions/eda/rulebooks/capacity.yml; edit that file and regenerate with
#   python tools/platform_rulebooks.py
# The rulesets, sources and rules are the standalone rulebook's, with every
# run_playbook turned into run_job_template against the job template
# aap/seed.yml creates for that playbook (organization aap_organization;
# alert_log, request_dir and baseline_dir come from the templates), the
# project's event sources named by their collection FQCN, and the
# webhook-only and tick-only rulesets left out (event streams, the
# controller workflow and the controller's schedules for the DR drill, the
# showback and the selftest take their place on the platform).
- name: FlashBlade capacity
  hosts: all
  sources:
    - sdodsley.flashblade_eda.purefb_events:
        arrays: '{{ purefb_arrays }}'
        signals:
          - telemetry
        telemetry_interval: '{{ telemetry_interval }}'
        fs_quota_warn_pct: '{{ fs_quota_warn_pct }}'
        top_growers: 5
  rules:
    - name: Poll failing for many polls - escalate
      condition: event.purefb_poll_error is defined and event.purefb_poll_error.escalate == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefb_poll_error.array
          - event.purefb_poll_error.signal
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: '{{ event.purefb_poll_error.array }} {{ event.purefb_poll_error.signal }} poll has failed {{ event.purefb_poll_error.consecutive }} times in a row'
              detail: '{{ event.purefb_poll_error.error }}'
              target_array: '{{ event.purefb_poll_error.array }}'
    - name: Poll failed - notify once
      condition: event.purefb_poll_error is defined and event.purefb_poll_error.consecutive == 1
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_poll_error.array
          - event.purefb_poll_error.signal
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: info
              subject: '{{ event.purefb_poll_error.array }} {{ event.purefb_poll_error.signal }} poll failed'
              detail: '{{ event.purefb_poll_error.error }}'
              target_array: '{{ event.purefb_poll_error.array }}'
    - name: Report poll errors without acting
      condition: event.purefb_poll_error is defined
      action:
        debug:
          msg: 'poll failed ({{ event.purefb_poll_error.signal }} on {{ event.purefb_poll_error.array }}): {{ event.purefb_poll_error.error }}'
    - name: Array at capacity risk - raise an approval request
      condition: "event.purefb_capacity.used_pct is defined and (event.purefb_capacity.used_pct >= vars.capacity_risk_pct or\n (event.purefb_capacity.days_to_full_known == true and\n  event.purefb_capacity.days_to_full <= vars.capacity_days_to_full_warning)) and\nvars.orchestrator_enabled == false"
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefb_capacity.array
      action:
        run_job_template:
          name: FlashBlade - capacity request
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              at_risk_array: '{{ event.purefb_capacity.array }}'
              used_pct: '{{ event.purefb_capacity.used_pct }}'
              used_bytes: '{{ event.purefb_capacity.used_bytes }}'
              capacity_bytes: '{{ event.purefb_capacity.capacity_bytes }}'
              days_to_full: '{{ event.purefb_capacity.days_to_full }}'
              growth_bytes_per_day: '{{ event.purefb_capacity.growth_bytes_per_day }}'
              top_growers: '{{ event.purefb_capacity.top_growers }}'
              pending_eradication_file_systems: '{{ event.purefb_capacity.pending_eradication_file_systems }}'
              pending_eradication_buckets: '{{ event.purefb_capacity.pending_eradication_buckets }}'
              pending_eradication_snapshots: '{{ event.purefb_capacity.pending_eradication_snapshots }}'
              candidate_targets: '{{ event.purefb_capacity.others }}'
              s3_requests_enabled: '{{ s3_requests_enabled }}'
              object_store: '{{ object_store }}'
    - name: Array at capacity risk - hand the event to the orchestrator
      condition: "event.purefb_capacity.used_pct is defined and (event.purefb_capacity.used_pct >= vars.capacity_risk_pct or\n (event.purefb_capacity.days_to_full_known == true and\n  event.purefb_capacity.days_to_full <= vars.capacity_days_to_full_warning)) and\nvars.orchestrator_enabled == true"
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefb_capacity.array
      action:
        run_job_template:
          name: FlashBlade - orchestrator post
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              orchestrator_url: '{{ orchestrator_url }}'
              orchestrator_webhook_path: '{{ orchestrator_paths.capacity }}'
              orchestrator_validate_certs: '{{ orchestrator_validate_certs }}'
              event: '{{ event }}'
              array: '{{ event.purefb_capacity.array }}'
              orchestrator_fallback_local: '{{ orchestrator_fallback_local }}'
    - name: Hard-limited file system near its provisioned size - grow it
      condition: event.purefb_fs_quota.used_pct is defined and event.purefb_fs_quota.used_pct >= vars.fs_quota_grow_pct and event.purefb_fs_quota.hard_limit_enabled == true and event.purefb_fs_quota.destroyed == false and vars.fs_auto_grow == true
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_fs_quota.array
          - event.purefb_fs_quota.file_system
      action:
        run_job_template:
          name: FlashBlade - grow file system
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              target_array: '{{ event.purefb_fs_quota.array }}'
              file_system: '{{ event.purefb_fs_quota.file_system }}'
              observed_provisioned: '{{ event.purefb_fs_quota.provisioned }}'
              observed_used_bytes: '{{ event.purefb_fs_quota.used_bytes }}'
              observed_used_pct: '{{ event.purefb_fs_quota.used_pct }}'
              fs_grow_step_pct: '{{ fs_grow_step_pct }}'
              fs_grow_max_bytes: '{{ fs_grow_max_bytes }}'
              fs_grow_exclude: '{{ fs_grow_exclude }}'
              s3_requests_enabled: '{{ s3_requests_enabled }}'
              object_store: '{{ object_store }}'
              fb_api_version: '{{ fb_api_version }}'
    - name: File system near its provisioned size - notify
      condition: event.purefb_fs_quota.used_pct is defined and event.purefb_fs_quota.used_pct >= vars.fs_quota_warn_pct and event.purefb_fs_quota.destroyed == false
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefb_fs_quota.array
          - event.purefb_fs_quota.file_system
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: '{{ event.purefb_fs_quota.array }}/{{ event.purefb_fs_quota.file_system }} is at {{ event.purefb_fs_quota.used_pct }}% of its provisioned size'
              detail: used={{ event.purefb_fs_quota.used_bytes }} of provisioned={{ event.purefb_fs_quota.provisioned }} bytes, hard_limit={{ event.purefb_fs_quota.hard_limit_enabled }} snapshots={{ event.purefb_fs_quota.snapshot_bytes }} bytes qos_policy={{ event.purefb_fs_quota.qos_policy }}
              target_array: '{{ event.purefb_fs_quota.array }}'
