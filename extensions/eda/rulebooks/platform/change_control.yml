#
# Generated by tools/platform_rulebooks.py from
# extensions/eda/rulebooks/change_control.yml; edit that file and regenerate with
#   python tools/platform_rulebooks.py
# The rulesets, sources and rules are the standalone rulebook's, with every
# run_playbook turned into run_job_template against the job template
# aap/seed.yml creates for that playbook (organization aap_organization;
# alert_log, request_dir and baseline_dir come from the templates), the
# project's event sources named by their collection FQCN, and the
# webhook-only and tick-only rulesets left out (event streams, the
# controller workflow and the controller's schedules for the DR drill, the
# showback and the selftest take their place on the platform).
- name: FlashBlade change control
  hosts: all
  sources:
    - sdodsley.flashblade_eda.purefb_events:
        arrays: '{{ config_arrays | default(purefb_arrays) }}'
        signals:
          - audits
        audits_interval: '{{ audits_interval }}'
        automation_users: '{{ automation_users }}'
        automation_user_agents: '{{ automation_user_agents }}'
        destructive_subcommands: '{{ destructive_subcommands }}'
  rules:
    - name: Poll failing for many polls - escalate
      condition: event.purefb_poll_error is defined and event.purefb_poll_error.escalate == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefb_poll_error.array
          - event.purefb_poll_error.signal
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: '{{ event.purefb_poll_error.array }} {{ event.purefb_poll_error.signal }} poll has failed {{ event.purefb_poll_error.consecutive }} times in a row'
              detail: '{{ event.purefb_poll_error.error }}'
              target_array: '{{ event.purefb_poll_error.array }}'
    - name: Poll failed - notify once
      condition: event.purefb_poll_error is defined and event.purefb_poll_error.consecutive == 1
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_poll_error.array
          - event.purefb_poll_error.signal
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: info
              subject: '{{ event.purefb_poll_error.array }} {{ event.purefb_poll_error.signal }} poll failed'
              detail: '{{ event.purefb_poll_error.error }}'
              target_array: '{{ event.purefb_poll_error.array }}'
    - name: Report poll errors without acting
      condition: event.purefb_poll_error is defined
      action:
        debug:
          msg: 'poll failed ({{ event.purefb_poll_error.signal }} on {{ event.purefb_poll_error.array }}): {{ event.purefb_poll_error.error }}'
    - name: Governed setting changed by a human - reconcile from the baseline
      condition: event.purefb_audit.command is defined and event.purefb_audit.command in vars.governed_commands and event.purefb_audit.by_automation == false and event.purefb_audit.maintenance_active == false
      throttle:
        once_within: 2 minutes
        group_by_attributes:
          - event.purefb_audit.array
          - event.purefb_audit.command
      action:
        run_job_template:
          name: FlashBlade - reconcile
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              target_array: '{{ event.purefb_audit.array }}'
              audit_user: '{{ event.purefb_audit.user }}'
              audit_interface: '{{ event.purefb_audit.user_interface }}'
              audit_ip_address: '{{ event.purefb_audit.ip_address }}'
              audit_command: '{{ event.purefb_audit.command }}'
              audit_subcommand: '{{ event.purefb_audit.subcommand }}'
              audit_arguments: '{{ event.purefb_audit.arguments }}'
              audit_time: '{{ event.purefb_audit.time }}'
    - name: Governed setting changed during a maintenance window - log only
      condition: event.purefb_audit.command is defined and event.purefb_audit.command in vars.governed_commands and event.purefb_audit.by_automation == false and event.purefb_audit.maintenance_active == true
      action:
        debug:
          msg: 'maintenance window on {{ event.purefb_audit.array }}: {{ event.purefb_audit.user }} ran {{ event.purefb_audit.command }} {{ event.purefb_audit.subcommand }} {{ event.purefb_audit.arguments }}; not reconciled'
    - name: Destructive command by a human - notify
      condition: event.purefb_audit.command is defined and event.purefb_audit.command in vars.destructive_commands and event.purefb_audit.destructive == true and event.purefb_audit.by_automation == false
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: '{{ event.purefb_audit.user }} ran {{ event.purefb_audit.command }} {{ event.purefb_audit.subcommand }} on {{ event.purefb_audit.array }}'
              detail: 'arguments: {{ event.purefb_audit.arguments }} (from {{ event.purefb_audit.ip_address }} over {{ event.purefb_audit.user_interface }}, audit {{ event.purefb_audit.audit_id }})'
              target_array: '{{ event.purefb_audit.array }}'
    - name: Change by the automation account - log
      condition: event.purefb_audit.by_automation == true
      action:
        debug:
          msg: 'automation ({{ event.purefb_audit.user }}) on {{ event.purefb_audit.array }}: {{ event.purefb_audit.command }} {{ event.purefb_audit.subcommand }} {{ event.purefb_audit.arguments }}'
