#
# Generated by tools/platform_rulebooks.py from
# extensions/eda/rulebooks/config_drift.yml; edit that file and regenerate with
#   python tools/platform_rulebooks.py
# The rulesets, sources and rules are the standalone rulebook's, with every
# run_playbook turned into run_job_template against the job template
# aap/seed.yml creates for that playbook (organization aap_organization;
# alert_log, request_dir and baseline_dir come from the templates), the
# project's event sources named by their collection FQCN, and the
# webhook-only and tick-only rulesets left out (event streams, the
# controller workflow and the controller's schedules for the DR drill, the
# showback and the selftest take their place on the platform).
- name: FlashBlade config drift
  hosts: all
  sources:
    - sdodsley.flashblade_eda.purefb_events:
        arrays: '{{ config_arrays | default(purefb_arrays) }}'
        signals:
          - config
        config_interval: '{{ config_interval }}'
      filters:
        - sdodsley.flashblade_eda.jinja_safe: null
  rules:
    - name: Poll failing for many polls - escalate
      condition: event.purefb_poll_error is defined and event.purefb_poll_error.escalate == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefb_poll_error.array
          - event.purefb_poll_error.signal
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: '{{ event.purefb_poll_error.array }} {{ event.purefb_poll_error.signal }} poll has failed {{ event.purefb_poll_error.consecutive }} times in a row'
              detail: '{{ event.purefb_poll_error.error }}'
              target_array: '{{ event.purefb_poll_error.array }}'
    - name: Poll failed - notify once
      condition: event.purefb_poll_error is defined and event.purefb_poll_error.consecutive == 1
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_poll_error.array
          - event.purefb_poll_error.signal
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: info
              subject: '{{ event.purefb_poll_error.array }} {{ event.purefb_poll_error.signal }} poll failed'
              detail: '{{ event.purefb_poll_error.error }}'
              target_array: '{{ event.purefb_poll_error.array }}'
    - name: Report poll errors without acting
      condition: event.purefb_poll_error is defined
      action:
        debug:
          msg: 'poll failed ({{ event.purefb_poll_error.signal }} on {{ event.purefb_poll_error.array }}): {{ event.purefb_poll_error.error }}'
    - name: NTP drift - reapply baseline
      condition: event.purefb_config.ntp_servers_csv is defined and event.purefb_config.ntp_servers_csv != vars.baseline_ntp_servers_csv
      throttle:
        once_within: 10 minutes
        group_by_attributes:
          - event.purefb_config.array
      action:
        run_job_template:
          name: FlashBlade - remediate NTP
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              target_array: '{{ event.purefb_config.array }}'
              observed_ntp_servers: '{{ event.purefb_config.ntp_servers_csv }}'
              baseline_ntp_servers_csv: '{{ baseline_ntp_servers_csv }}'
    - name: DNS drift - reapply baseline
      condition: "event.purefb_config.dns_nameservers_csv is defined and (event.purefb_config.dns_nameservers_csv != vars.baseline_dns_nameservers_csv or\n event.purefb_config.dns_domain != vars.baseline_dns_domain)"
      throttle:
        once_within: 10 minutes
        group_by_attributes:
          - event.purefb_config.array
      action:
        run_job_template:
          name: FlashBlade - remediate DNS
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              target_array: '{{ event.purefb_config.array }}'
              observed_dns_domain: '{{ event.purefb_config.dns_domain }}'
              observed_dns_nameservers: '{{ event.purefb_config.dns_nameservers_csv }}'
              baseline_dns_domain: '{{ baseline_dns_domain }}'
              baseline_dns_nameservers_csv: '{{ baseline_dns_nameservers_csv }}'
    - name: Management directory service drift - notify only
      condition: "event.purefb_config.ds_management_uris_csv is defined and (event.purefb_config.ds_management_uris_csv != vars.baseline_ds_management_uris_csv or\n event.purefb_config.ds_management_base_dn != vars.baseline_ds_management_base_dn or\n event.purefb_config.ds_management_enabled != vars.baseline_ds_management_enabled)"
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_config.array
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: Management directory service drift on {{ event.purefb_config.array }}
              detail: enabled={{ event.purefb_config.ds_management_enabled }} uris={{ event.purefb_config.ds_management_uris_csv }} base_dn={{ event.purefb_config.ds_management_base_dn }} bind_user={{ event.purefb_config.ds_management_bind_user }}; baseline enabled={{ baseline_ds_management_enabled }} uris={{ baseline_ds_management_uris_csv }} base_dn={{ baseline_ds_management_base_dn }}
              target_array: '{{ event.purefb_config.array }}'
    - name: Eradication settings drift - notify only, never remediate
      condition: "event.purefb_config.manual_eradication is defined and (event.purefb_config.manual_eradication != vars.baseline_manual_eradication or\n event.purefb_config.eradication_delay_ms < vars.baseline_min_eradication_delay_ms)"
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_config.array
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: Eradication settings changed on {{ event.purefb_config.array }}
              detail: manual_eradication={{ event.purefb_config.manual_eradication }} eradication_delay_ms={{ event.purefb_config.eradication_delay_ms }}; baseline manual_eradication={{ baseline_manual_eradication }} minimum delay={{ baseline_min_eradication_delay_ms }}
              target_array: '{{ event.purefb_config.array }}'
    - name: Admin authentication settings drift - notify only
      condition: "event.purefb_config.max_login_attempts is defined and (event.purefb_config.max_login_attempts != vars.baseline_max_login_attempts or\n event.purefb_config.lockout_duration_ms != vars.baseline_lockout_duration_ms or\n event.purefb_config.min_password_length < vars.baseline_min_password_length or\n event.purefb_config.sso_enabled != vars.baseline_sso_enabled)"
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_config.array
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: Admin authentication settings drift on {{ event.purefb_config.array }}
              detail: max_login_attempts={{ event.purefb_config.max_login_attempts }} (baseline {{ baseline_max_login_attempts }}) lockout_duration_ms={{ event.purefb_config.lockout_duration_ms }} (baseline {{ baseline_lockout_duration_ms }}) min_password_length={{ event.purefb_config.min_password_length }} (baseline at least {{ baseline_min_password_length }}) sso_enabled={{ event.purefb_config.sso_enabled }} (baseline {{ baseline_sso_enabled }})
              target_array: '{{ event.purefb_config.array }}'
    - name: Active Directory membership drift - notify only
      condition: event.purefb_config.ad_joined is defined and event.purefb_config.ad_joined != vars.baseline_ad_joined
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_config.array
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: Active Directory membership changed on {{ event.purefb_config.array }}
              detail: ad_joined={{ event.purefb_config.ad_joined }}; baseline ad_joined={{ baseline_ad_joined }}
              target_array: '{{ event.purefb_config.array }}'
    - name: No syslog target carries the data-audit service - notify
      condition: event.purefb_config.syslog_data_audit_servers_csv is defined and event.purefb_config.syslog_data_audit_servers_csv == "" and vars.require_data_audit_syslog == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefb_config.array
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: File audit records from {{ event.purefb_config.array }} go nowhere
              detail: 'no syslog server has the data-audit service (servers: {{ event.purefb_config.syslog_servers_csv }}); require_data_audit_syslog is true'
              target_array: '{{ event.purefb_config.array }}'
