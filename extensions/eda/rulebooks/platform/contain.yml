# Generated by tools/platform_rulebooks.py from
# extensions/eda/rulebooks/contain.yml; edit that file and regenerate with
#   python tools/platform_rulebooks.py
# The rulesets, sources and rules are the standalone rulebook's, with every
# run_playbook turned into run_job_template against the job template
# aap/seed.yml creates for that playbook (organization aap_organization;
# alert_log, request_dir and baseline_dir come from the templates), the
# project's event sources named by their collection FQCN, and the
# webhook-only and tick-only rulesets left out (event streams, the
# controller workflow and the controller's schedules for the DR drill, the
# showback and the selftest take their place on the platform).
- name: FlashBlade containment
  hosts: all
  sources:
    - sdodsley.flashblade_eda.purefb_events:
        arrays: '{{ purefb_arrays }}'
        signals:
          - telemetry
        telemetry_interval: '{{ telemetry_interval }}'
        client_min_share_pct: '{{ client_min_share_pct }}'
        top_clients: 10
        top_file_systems: 10
        top_buckets: 10
      filters:
        - sdodsley.flashblade_eda.jinja_safe: null
  rules:
    - name: Poll failing for many polls - escalate
      condition: event.purefb_poll_error is defined and event.purefb_poll_error.escalate == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefb_poll_error.array
          - event.purefb_poll_error.signal
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: '{{ event.purefb_poll_error.array }} {{ event.purefb_poll_error.signal }} poll has failed {{ event.purefb_poll_error.consecutive }} times in a row'
              detail: '{{ event.purefb_poll_error.error }}'
              target_array: '{{ event.purefb_poll_error.array }}'
    - name: Poll failed - notify once
      condition: event.purefb_poll_error is defined and event.purefb_poll_error.consecutive == 1
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_poll_error.array
          - event.purefb_poll_error.signal
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: info
              subject: '{{ event.purefb_poll_error.array }} {{ event.purefb_poll_error.signal }} poll failed'
              detail: '{{ event.purefb_poll_error.error }}'
              target_array: '{{ event.purefb_poll_error.array }}'
    - name: Report poll errors without acting
      condition: event.purefb_poll_error is defined
      action:
        debug:
          msg: 'poll failed ({{ event.purefb_poll_error.signal }} on {{ event.purefb_poll_error.array }}): {{ event.purefb_poll_error.error }}'
    - name: Client holding the array - quarantine
      condition: event.purefb_client_performance.high_share_polls is defined and event.purefb_client_performance.high_share_polls >= vars.contain_consecutive_polls and event.purefb_client_performance.ops_share_pct >= vars.contain_min_share_pct and event.purefb_client_performance.baseline_known == true and event.purefb_client_performance.array_write_latency_ratio >= vars.baseline_latency_ratio and vars.ir_auto_contain == true
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_client_performance.array
          - event.purefb_client_performance.client
      action:
        run_job_template:
          name: FlashBlade - quarantine client
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              target_array: '{{ event.purefb_client_performance.array }}'
              client: '{{ event.purefb_client_performance.client }}'
              file_system: ''
              action: quarantine
              reason: '{{ event.purefb_client_performance.protocol }} client held {{ event.purefb_client_performance.ops_share_pct }}% of the ops (iops={{ event.purefb_client_performance.reads_per_sec }}r/{{ event.purefb_client_performance.writes_per_sec }}w) for {{ event.purefb_client_performance.high_share_polls }} polls while the array''s write latency was {{ event.purefb_client_performance.array_write_latency_ratio }}x the same half hour last week'
              contain_exclude_clients: '{{ contain_exclude_clients }}'
              contain_exclude_file_systems: '{{ contain_exclude_file_systems }}'
              fb_api_version: '{{ fb_api_version }}'
    - name: Client holding the array - notify
      condition: event.purefb_client_performance.high_share_polls is defined and event.purefb_client_performance.high_share_polls >= vars.contain_consecutive_polls and event.purefb_client_performance.ops_share_pct >= vars.contain_min_share_pct and event.purefb_client_performance.baseline_known == true and event.purefb_client_performance.array_write_latency_ratio >= vars.baseline_latency_ratio and vars.ir_auto_contain == false
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_client_performance.array
          - event.purefb_client_performance.client
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: Client {{ event.purefb_client_performance.client }} is holding {{ event.purefb_client_performance.ops_share_pct }}% of the ops on {{ event.purefb_client_performance.array }}
              detail: iops={{ event.purefb_client_performance.reads_per_sec }}r/{{ event.purefb_client_performance.writes_per_sec }}w write={{ event.purefb_client_performance.usec_per_write_op }}us for {{ event.purefb_client_performance.high_share_polls }} polls; array write={{ event.purefb_client_performance.array_usec_per_write_op }}us, {{ event.purefb_client_performance.array_write_latency_ratio }}x the same half hour last week; ir_auto_contain is off
              target_array: '{{ event.purefb_client_performance.array }}'
    - name: File system hogging - tarpit
      condition: event.purefb_fs_performance.high_share_polls is defined and event.purefb_fs_performance.high_share_polls >= vars.contain_consecutive_polls and event.purefb_fs_performance.ops_share_pct >= vars.contain_min_share_pct and event.purefb_fs_performance.eda_capped == false and event.purefb_fs_performance.eda_tarpit == false and vars.ir_auto_tarpit == true
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_fs_performance.array
          - event.purefb_fs_performance.file_system
      action:
        run_job_template:
          name: FlashBlade - tarpit
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              target_array: '{{ event.purefb_fs_performance.array }}'
              file_system: '{{ event.purefb_fs_performance.file_system }}'
              action: apply
              tarpit_ops_per_sec: '{{ tarpit_ops_per_sec }}'
              reason: iops={{ event.purefb_fs_performance.reads_per_sec }}r/{{ event.purefb_fs_performance.writes_per_sec }}w ({{ event.purefb_fs_performance.ops_share_pct }}% of the array) for {{ event.purefb_fs_performance.high_share_polls }} polls
              fb_api_version: '{{ fb_api_version }}'
    - name: Tarpitted file system calm - lift
      condition: event.purefb_fs_performance.eda_tarpit is defined and event.purefb_fs_performance.eda_tarpit == true and event.purefb_fs_performance.normal_polls >= vars.contain_release_normal_polls
      throttle:
        once_within: 10 minutes
        group_by_attributes:
          - event.purefb_fs_performance.array
          - event.purefb_fs_performance.file_system
      action:
        run_job_template:
          name: FlashBlade - tarpit
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              target_array: '{{ event.purefb_fs_performance.array }}'
              file_system: '{{ event.purefb_fs_performance.file_system }}'
              action: lift
              tarpit_ops_per_sec: '{{ tarpit_ops_per_sec }}'
              reason: share normal for {{ event.purefb_fs_performance.normal_polls }} polls
              fb_api_version: '{{ fb_api_version }}'
