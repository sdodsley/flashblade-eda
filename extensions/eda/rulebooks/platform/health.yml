#
# Generated by tools/platform_rulebooks.py from
# extensions/eda/rulebooks/health.yml; edit that file and regenerate with
#   python tools/platform_rulebooks.py
# The rulesets, sources and rules are the standalone rulebook's, with every
# run_playbook turned into run_job_template against the job template
# aap/seed.yml creates for that playbook (organization aap_organization;
# alert_log, request_dir and baseline_dir come from the templates), the
# project's event sources named by their collection FQCN, and the
# webhook-only and tick-only rulesets left out (event streams, the
# controller workflow and the controller's schedules for the DR drill, the
# showback and the selftest take their place on the platform).
- name: FlashBlade health
  hosts: all
  sources:
    - sdodsley.flashblade_eda.purefb_events:
        arrays: '{{ purefb_arrays }}'
        signals:
          - health
        health_interval: '{{ health_interval }}'
      filters:
        - sdodsley.flashblade_eda.jinja_safe: null
  rules:
    - name: Poll failing for many polls - escalate
      condition: event.purefb_poll_error is defined and event.purefb_poll_error.escalate == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefb_poll_error.array
          - event.purefb_poll_error.signal
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: '{{ event.purefb_poll_error.array }} {{ event.purefb_poll_error.signal }} poll has failed {{ event.purefb_poll_error.consecutive }} times in a row'
              detail: '{{ event.purefb_poll_error.error }}'
              target_array: '{{ event.purefb_poll_error.array }}'
    - name: Poll failed - notify once
      condition: event.purefb_poll_error is defined and event.purefb_poll_error.consecutive == 1
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_poll_error.array
          - event.purefb_poll_error.signal
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: '{{ event.purefb_poll_error.array }} {{ event.purefb_poll_error.signal }} poll failed'
              detail: '{{ event.purefb_poll_error.error }}'
              target_array: '{{ event.purefb_poll_error.array }}'
    - name: Report poll errors without acting
      condition: event.purefb_poll_error is defined
      action:
        debug:
          msg: 'poll failed ({{ event.purefb_poll_error.signal }} on {{ event.purefb_poll_error.array }}): {{ event.purefb_poll_error.error }}'
    - name: Hardware issue outside a maintenance window - identify LED and notify
      condition: event.purefb_hardware.status is defined and event.purefb_hardware.maintenance_active == false
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_hardware.array
          - event.purefb_hardware.component
      action:
        run_job_template:
          name: FlashBlade - identify LED
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              target_array: '{{ event.purefb_hardware.array }}'
              component: '{{ event.purefb_hardware.component }}'
              component_type: '{{ event.purefb_hardware.type }}'
              component_status: '{{ event.purefb_hardware.status }}'
              component_details: '{{ event.purefb_hardware.details }}'
              component_slot: '{{ event.purefb_hardware.slot }}'
              component_serial: '{{ event.purefb_hardware.serial }}'
              neighbor_switch: '{{ event.purefb_hardware.neighbor_switch }}'
              neighbor_switch_address: '{{ event.purefb_hardware.neighbor_switch_address }}'
              neighbor_port: '{{ event.purefb_hardware.neighbor_port }}'
              led_state: true
    - name: Hardware issue during a maintenance window - log only
      condition: event.purefb_hardware.status is defined and event.purefb_hardware.maintenance_active == true
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_hardware.array
          - event.purefb_hardware.component
      action:
        debug:
          msg: 'maintenance window active on {{ event.purefb_hardware.array }}: {{ event.purefb_hardware.component }} {{ event.purefb_hardware.status }} not actioned'
    - name: Hardware recovered - clear the identify LED
      condition: event.purefb_hardware_recovered.component is defined and event.purefb_hardware_recovered.maintenance_active == false
      action:
        run_job_template:
          name: FlashBlade - identify LED
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              target_array: '{{ event.purefb_hardware_recovered.array }}'
              component: '{{ event.purefb_hardware_recovered.component }}'
              component_type: '{{ event.purefb_hardware_recovered.type }}'
              component_status: '{{ event.purefb_hardware_recovered.status }}'
              component_details: recovered from {{ event.purefb_hardware_recovered.previous_status }}
              led_state: false
              severity: info
    - name: Hardware recovered during a maintenance window - log
      condition: event.purefb_hardware_recovered.component is defined
      action:
        debug:
          msg: '{{ event.purefb_hardware_recovered.array }} {{ event.purefb_hardware_recovered.component }} recovered ({{ event.purefb_hardware_recovered.previous_status }} -> {{ event.purefb_hardware_recovered.status }}) during a maintenance window; identify LED left as it is'
    - name: Link aggregation group degraded - notify
      condition: event.purefb_lag.degraded is defined and event.purefb_lag.degraded == true
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_lag.array
          - event.purefb_lag.lag
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: LAG {{ event.purefb_lag.lag }} on {{ event.purefb_lag.array }} is {{ event.purefb_lag.status }} at {{ event.purefb_lag.lag_speed }} of {{ event.purefb_lag.expected_speed }} bit/s
              detail: 'ports: {{ event.purefb_lag.ports }}'
              target_array: '{{ event.purefb_lag.array }}'
    - name: Link aggregation group recovered - notify
      condition: event.purefb_lag.recovered is defined and event.purefb_lag.recovered == true
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: info
              subject: LAG {{ event.purefb_lag.lag }} on {{ event.purefb_lag.array }} is back at {{ event.purefb_lag.lag_speed }} bit/s
              detail: 'ports: {{ event.purefb_lag.ports }}'
              target_array: '{{ event.purefb_lag.array }}'
    - name: Blade not healthy - notify
      condition: event.purefb_health.blade_issue_count is defined and event.purefb_health.blade_issue_count > 0
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_health.array
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: Blade issue on {{ event.purefb_health.array }}
              detail: '{{ event.purefb_health.blade_issues }}'
              target_array: '{{ event.purefb_health.array }}'
    - name: Drive not healthy - notify
      condition: event.purefb_health.drive_issue_count is defined and event.purefb_health.drive_issue_count > 0
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_health.array
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: Drive issue on {{ event.purefb_health.array }}
              detail: '{{ event.purefb_health.drive_issues }}'
              target_array: '{{ event.purefb_health.array }}'
    - name: Maintenance window active - log
      condition: event.purefb_health.maintenance_active == true
      throttle:
        once_within: 10 minutes
        group_by_attributes:
          - event.purefb_health.array
      action:
        debug:
          msg: 'maintenance window active on {{ event.purefb_health.array }}: {{ event.purefb_health.maintenance_windows }}'
    - name: Remote assist session open - log
      condition: event.purefb_health.remote_assist_active == true
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_health.array
      action:
        debug:
          msg: remote assist is active on {{ event.purefb_health.array }}
