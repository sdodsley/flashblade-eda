#
# Generated by tools/platform_rulebooks.py from
# extensions/eda/rulebooks/posture.yml; edit that file and regenerate with
#   python tools/platform_rulebooks.py
# The rulesets, sources and rules are the standalone rulebook's, with every
# run_playbook turned into run_job_template against the job template
# aap/seed.yml creates for that playbook (organization aap_organization;
# alert_log, request_dir and baseline_dir come from the templates), the
# project's event sources named by their collection FQCN, and the
# webhook-only and tick-only rulesets left out (event streams, the
# controller workflow and the controller's schedules for the DR drill, the
# showback and the selftest take their place on the platform).
- name: FlashBlade posture
  hosts: all
  match_multiple_rules: true
  sources:
    - sdodsley.flashblade_eda.purefb_events:
        arrays: '{{ purefb_arrays }}'
        signals:
          - posture
        posture_interval: '{{ posture_interval }}'
        key_max_age_days: '{{ key_max_age_days }}'
        cert_warn_days: '{{ cert_warn_days }}'
        coverage_exclude: '{{ coverage_exclude }}'
        posture_exclude_file_systems: '{{ posture_exclude_file_systems }}'
      filters:
        - sdodsley.flashblade_eda.jinja_safe: null
  rules:
    - name: Poll failing for many polls - escalate
      condition: event.purefb_poll_error is defined and event.purefb_poll_error.escalate == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefb_poll_error.array
          - event.purefb_poll_error.signal
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: '{{ (event.purefb_poll_error.array ~ '' '' ~ event.purefb_poll_error.signal ~ '' poll has failed '' ~ event.purefb_poll_error.consecutive ~ '' times in a row'') | pprint }}'
              detail: '{{ event.purefb_poll_error.error | pprint }}'
              target_array: '{{ event.purefb_poll_error.array | pprint }}'
    - name: Poll failed - notify once
      condition: event.purefb_poll_error is defined and event.purefb_poll_error.consecutive == 1
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_poll_error.array
          - event.purefb_poll_error.signal
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: info
              subject: '{{ (event.purefb_poll_error.array ~ '' '' ~ event.purefb_poll_error.signal ~ '' poll failed'') | pprint }}'
              detail: '{{ event.purefb_poll_error.error | pprint }}'
              target_array: '{{ event.purefb_poll_error.array | pprint }}'
    - name: Report poll errors without acting
      condition: event.purefb_poll_error is defined
      action:
        debug:
          msg: 'poll failed ({{ event.purefb_poll_error.signal }} on {{ event.purefb_poll_error.array }}): {{ event.purefb_poll_error.error }}'
    - name: Public bucket - block public access
      condition: event.purefb_posture.public_count is defined and event.purefb_posture.public_count > 0 and vars.posture_auto_revert == true
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefb_posture.array
      action:
        run_job_template:
          name: FlashBlade - posture revert
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              target_array: '{{ event.purefb_posture.array | pprint }}'
              buckets: '{{ event.purefb_posture.public_buckets | pprint }}'
    - name: Public bucket - notify
      condition: event.purefb_posture.public_count is defined and event.purefb_posture.public_count > 0 and vars.posture_auto_revert == false
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefb_posture.array
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: '{{ (event.purefb_posture.public_count ~ '' public bucket(s) on '' ~ event.purefb_posture.array) | pprint }}'
              detail: '{{ (event.purefb_posture.public_buckets ~ ''; posture_auto_revert is off'') | pprint }}'
              target_array: '{{ event.purefb_posture.array | pprint }}'
    - name: World-open NFS export - notify
      condition: event.purefb_posture.world_open_export_count is defined and event.purefb_posture.world_open_export_count > 0
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefb_posture.array
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: '{{ (event.purefb_posture.world_open_export_count ~ '' NFS export rule(s) grant * read-write on '' ~ event.purefb_posture.array) | pprint }}'
              detail: '{{ event.purefb_posture.world_open_exports | pprint }}'
              target_array: '{{ event.purefb_posture.array | pprint }}'
    - name: Access key older than the limit - notify
      condition: event.purefb_posture.old_key_count is defined and event.purefb_posture.old_key_count > 0
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefb_posture.array
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: '{{ (event.purefb_posture.old_key_count ~ '' object store access key(s) older than the limit on '' ~ event.purefb_posture.array) | pprint }}'
              detail: '{{ (event.purefb_posture.old_keys ~ ''; '' ~ event.purefb_posture.disabled_key_count ~ '' key(s) disabled'') | pprint }}'
              target_array: '{{ event.purefb_posture.array | pprint }}'
    - name: Certificate expiring - notify
      condition: event.purefb_posture.expiring_cert_count is defined and event.purefb_posture.expiring_cert_count > 0
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefb_posture.array
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: '{{ (event.purefb_posture.expiring_cert_count ~ '' certificate(s) expiring on '' ~ event.purefb_posture.array) | pprint }}'
              detail: '{{ (event.purefb_posture.expiring_certs ~ '' (days left; negative once expired)'') | pprint }}'
              target_array: '{{ event.purefb_posture.array | pprint }}'
    - name: Expiring certificate - renew
      condition: event.purefb_posture.expiring_cert_count is defined and event.purefb_posture.expiring_cert_count > 0 and vars.certs_auto_renew == true
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefb_posture.array
      action:
        run_job_template:
          name: FlashBlade - renew certificate
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              target_array: '{{ event.purefb_posture.array | pprint }}'
              certificate: '{{ event.purefb_posture.expiring_certs | pprint }}'
              certs_renew_days: '{{ certs_renew_days }}'
              fb_api_version: '{{ fb_api_version }}'
    - name: Bucket without audit coverage - notify
      condition: event.purefb_posture.uncovered_count is defined and event.purefb_posture.uncovered_count > 0
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefb_posture.array
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: '{{ (event.purefb_posture.uncovered_count ~ '' bucket(s) without an enabled audit policy on '' ~ event.purefb_posture.array) | pprint }}'
              detail: '{{ event.purefb_posture.uncovered_buckets | pprint }}'
              target_array: '{{ event.purefb_posture.array | pprint }}'
    - name: SMB share open to everyone - notify
      condition: event.purefb_posture.smb_everyone_full_control_count is defined and event.purefb_posture.smb_everyone_full_control_count > 0
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefb_posture.array
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: '{{ (event.purefb_posture.smb_everyone_full_control_count ~ '' SMB share policy(ies) grant Everyone full control on '' ~ event.purefb_posture.array) | pprint }}'
              detail: '{{ event.purefb_posture.smb_everyone_full_control | pprint }}'
              target_array: '{{ event.purefb_posture.array | pprint }}'
    - name: Posture - log
      condition: event.purefb_posture.issue_count is defined
      action:
        debug:
          msg: 'posture {{ event.purefb_posture.array }} ({{ event.purefb_posture.purity_version }}): {{ event.purefb_posture.issue_count }} finding(s): public {{ event.purefb_posture.public_count }}, uncovered {{ event.purefb_posture.uncovered_count }}, world-open exports {{ event.purefb_posture.world_open_export_count }}, old keys {{ event.purefb_posture.old_key_count }}, expiring certificates {{ event.purefb_posture.expiring_cert_count }}, SMB everyone {{ event.purefb_posture.smb_everyone_full_control_count }}'
