#
# Generated by tools/platform_rulebooks.py from
# extensions/eda/rulebooks/replication.yml; edit that file and regenerate with
#   python tools/platform_rulebooks.py
# The rulesets, sources and rules are the standalone rulebook's, with every
# run_playbook turned into run_job_template against the job template
# aap/seed.yml creates for that playbook (organization aap_organization;
# alert_log, request_dir and baseline_dir come from the templates), the
# project's event sources named by their collection FQCN, and the
# webhook-only and tick-only rulesets left out (event streams, the
# controller workflow and the controller's schedules for the DR drill, the
# showback and the selftest take their place on the platform).
- name: FlashBlade replication
  hosts: all
  sources:
    - sdodsley.flashblade_eda.purefb_events:
        arrays: '{{ purefb_arrays }}'
        signals:
          - replication
        replication_interval: '{{ replication_interval }}'
        replication_lag_warn_s: '{{ replication_lag_warn_s }}'
        replication_ok_statuses: '{{ replication_ok_statuses }}'
        replication_escalate_polls: '{{ replication_escalate_polls }}'
  rules:
    - name: Poll failing for many polls - escalate
      condition: event.purefb_poll_error is defined and event.purefb_poll_error.escalate == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefb_poll_error.array
          - event.purefb_poll_error.signal
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: '{{ (event.purefb_poll_error.array ~ '' '' ~ event.purefb_poll_error.signal ~ '' poll has failed '' ~ event.purefb_poll_error.consecutive ~ '' times in a row'') | pprint }}'
              detail: '{{ event.purefb_poll_error.error | pprint }}'
              target_array: '{{ event.purefb_poll_error.array | pprint }}'
    - name: Poll failed - notify once
      condition: event.purefb_poll_error is defined and event.purefb_poll_error.consecutive == 1
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_poll_error.array
          - event.purefb_poll_error.signal
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: info
              subject: '{{ (event.purefb_poll_error.array ~ '' '' ~ event.purefb_poll_error.signal ~ '' poll failed'') | pprint }}'
              detail: '{{ event.purefb_poll_error.error | pprint }}'
              target_array: '{{ event.purefb_poll_error.array | pprint }}'
    - name: Report poll errors without acting
      condition: event.purefb_poll_error is defined
      action:
        debug:
          msg: 'poll failed ({{ event.purefb_poll_error.signal }} on {{ event.purefb_poll_error.array }}): {{ event.purefb_poll_error.error }}'
    - name: Array connection not connected - notify
      condition: event.purefb_array_connection.connected is defined and event.purefb_array_connection.connected == false
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_array_connection.array
          - event.purefb_array_connection.remote
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: '{{ (event.purefb_array_connection.array ~ '' connection to '' ~ event.purefb_array_connection.remote ~ '' is '' ~ event.purefb_array_connection.status) | pprint }}'
              detail: type={{ event.purefb_array_connection.type }} version={{ event.purefb_array_connection.version }} replication addresses {{ event.purefb_array_connection.replication_addresses }}; was {{ event.purefb_array_connection.previous_status | default('unknown') }}
              target_array: '{{ event.purefb_array_connection.array | pprint }}'
    - name: Array connection back - log
      condition: event.purefb_array_connection.connected is defined and event.purefb_array_connection.connected == true and event.purefb_array_connection.previous_status is defined and event.purefb_array_connection.previous_status != "connected"
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: info
              subject: '{{ (event.purefb_array_connection.array ~ '' connection to '' ~ event.purefb_array_connection.remote ~ '' is connected again'') | pprint }}'
              detail: was {{ event.purefb_array_connection.previous_status }}; type={{ event.purefb_array_connection.type }}
              target_array: '{{ event.purefb_array_connection.array | pprint }}'
    - name: Replica link paused - resume
      condition: event.purefb_replica_link.paused is defined and event.purefb_replica_link.paused == true and event.purefb_replica_link.kind == "bucket" and vars.replication_auto_resume == true and vars.orchestrator_enabled == false
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_replica_link.array
          - event.purefb_replica_link.local
      action:
        run_job_template:
          name: FlashBlade - replication resume
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              target_array: '{{ event.purefb_replica_link.array | pprint }}'
              bucket: '{{ event.purefb_replica_link.local | pprint }}'
              reason: link to {{ event.purefb_replica_link.remote }}:{{ event.purefb_replica_link.remote_object }} paused, status={{ event.purefb_replica_link.status }}, recovery point {{ event.purefb_replica_link.recovery_point_age_s }}s old
              fb_api_version: '{{ fb_api_version }}'
    - name: Replica link paused - hand the event to the orchestrator
      condition: event.purefb_replica_link.paused is defined and event.purefb_replica_link.paused == true and event.purefb_replica_link.kind == "bucket" and vars.orchestrator_enabled == true
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_replica_link.array
          - event.purefb_replica_link.local
      action:
        run_job_template:
          name: FlashBlade - orchestrator post
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              orchestrator_url: '{{ orchestrator_url }}'
              orchestrator_webhook_path: '{{ orchestrator_paths.replication }}'
              orchestrator_validate_certs: '{{ orchestrator_validate_certs }}'
              event: '{{ event | pprint }}'
              array: '{{ event.purefb_replica_link.array | pprint }}'
    - name: Replica link paused - notify
      condition: event.purefb_replica_link.paused is defined and event.purefb_replica_link.paused == true and (event.purefb_replica_link.kind != "bucket" or vars.orchestrator_enabled == false)
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_replica_link.array
          - event.purefb_replica_link.local
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: Replica link {{ event.purefb_replica_link.local }} -> {{ event.purefb_replica_link.remote }}:{{ event.purefb_replica_link.remote_object }} is paused
              detail: '{{ (event.purefb_replica_link.kind ~ '' link, direction='' ~ event.purefb_replica_link.direction ~ '', status='' ~ event.purefb_replica_link.status ~ '', recovery point '' ~ event.purefb_replica_link.recovery_point_age_s ~ ''s old; replication_auto_resume='' ~ replication_auto_resume) | pprint }}'
              target_array: '{{ event.purefb_replica_link.array | pprint }}'
    - name: Replica link still unhealthy - escalate
      condition: event.purefb_replica_link.escalate is defined and event.purefb_replica_link.escalate == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefb_replica_link.array
          - event.purefb_replica_link.local
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: Replica link {{ event.purefb_replica_link.local }} -> {{ event.purefb_replica_link.remote }} has had an issue ({{ event.purefb_replica_link.status }}, lag {{ event.purefb_replica_link.lag_s }} s) for {{ event.purefb_replica_link.consecutive_issue_polls }} polls
              detail: '{{ (event.purefb_replica_link.kind ~ '' link, direction='' ~ event.purefb_replica_link.direction ~ '', lag '' ~ event.purefb_replica_link.lag_s ~ ''s, recovery point '' ~ event.purefb_replica_link.recovery_point_age_s ~ ''s old, details='' ~ event.purefb_replica_link.status_details) | pprint }}'
              target_array: '{{ event.purefb_replica_link.array | pprint }}'
    - name: Replica link unhealthy or lagging - notify
      condition: event.purefb_replica_link.escalate is defined and event.purefb_replica_link.escalate == false and (event.purefb_replica_link.unhealthy == true or event.purefb_replica_link.lagging == true)
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_replica_link.array
          - event.purefb_replica_link.local
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: Replica link {{ event.purefb_replica_link.local }} -> {{ event.purefb_replica_link.remote }} is {{ event.purefb_replica_link.status }}, lag {{ event.purefb_replica_link.lag_s }}s
              detail: '{{ (event.purefb_replica_link.kind ~ '' link, direction='' ~ event.purefb_replica_link.direction ~ '', unhealthy='' ~ event.purefb_replica_link.unhealthy ~ '' lagging='' ~ event.purefb_replica_link.lagging ~ '' for '' ~ event.purefb_replica_link.consecutive_issue_polls ~ '' polls, recovery point '' ~ event.purefb_replica_link.recovery_point_age_s ~ ''s old, details='' ~ event.purefb_replica_link.status_details) | pprint }}'
              target_array: '{{ event.purefb_replica_link.array | pprint }}'
    - name: Replica link recovered - log
      condition: event.purefb_replica_link.recovered is defined and event.purefb_replica_link.recovered == true
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: info
              subject: Replica link {{ event.purefb_replica_link.local }} -> {{ event.purefb_replica_link.remote }} recovered
              detail: '{{ (event.purefb_replica_link.kind ~ '' link, status='' ~ event.purefb_replica_link.status ~ '', lag '' ~ event.purefb_replica_link.lag_s ~ ''s, recovery point '' ~ event.purefb_replica_link.recovery_point_age_s ~ ''s old'') | pprint }}'
              target_array: '{{ event.purefb_replica_link.array | pprint }}'
    - name: Replication summary - log
      condition: event.purefb_replication.issue_count is defined
      action:
        debug:
          msg: 'replication {{ event.purefb_replication.array }}: {{ event.purefb_replication.connection_count }} connection(s), down {{ event.purefb_replication.connections_down }}; targets down {{ event.purefb_replication.targets_down }}; {{ event.purefb_replication.fs_link_count }} file system and {{ event.purefb_replication.bucket_link_count }} bucket link(s), unhealthy {{ event.purefb_replication.links_unhealthy }}, paused {{ event.purefb_replication.links_paused }}, lagging {{ event.purefb_replication.links_lagging }}, max lag {{ event.purefb_replication.max_lag_ms }} ms; {{ event.purefb_replication.issue_count }} issue(s), maintenance={{ event.purefb_replication.maintenance_active }}'
