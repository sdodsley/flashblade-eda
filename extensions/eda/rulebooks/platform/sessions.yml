#
# Generated by tools/platform_rulebooks.py from
# extensions/eda/rulebooks/sessions.yml; edit that file and regenerate with
#   python tools/platform_rulebooks.py
# The rulesets, sources and rules are the standalone rulebook's, with every
# run_playbook turned into run_job_template against the job template
# aap/seed.yml creates for that playbook (organization aap_organization;
# alert_log, request_dir and baseline_dir come from the templates), the
# project's event sources named by their collection FQCN, and the
# webhook-only and tick-only rulesets left out (event streams, the
# controller workflow and the controller's schedules for the DR drill, the
# showback and the selftest take their place on the platform).
- name: FlashBlade sessions
  hosts: all
  sources:
    - sdodsley.flashblade_eda.purefb_events:
        arrays: '{{ purefb_arrays }}'
        signals:
          - sessions
          - alerts
        sessions_interval: '{{ sessions_interval }}'
        alerts_interval: '{{ alerts_interval }}'
      filters:
        - sdodsley.flashblade_eda.jinja_safe: null
  rules:
    - name: Poll failing for many polls - escalate
      condition: event.purefb_poll_error is defined and event.purefb_poll_error.escalate == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefb_poll_error.array
          - event.purefb_poll_error.signal
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: '{{ (event.purefb_poll_error.array ~ '' '' ~ event.purefb_poll_error.signal ~ '' poll has failed '' ~ event.purefb_poll_error.consecutive ~ '' times in a row'') | pprint }}'
              detail: '{{ event.purefb_poll_error.error | pprint }}'
              target_array: '{{ event.purefb_poll_error.array | pprint }}'
    - name: Poll failed - notify once
      condition: event.purefb_poll_error is defined and event.purefb_poll_error.consecutive == 1
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_poll_error.array
          - event.purefb_poll_error.signal
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: info
              subject: '{{ (event.purefb_poll_error.array ~ '' '' ~ event.purefb_poll_error.signal ~ '' poll failed'') | pprint }}'
              detail: '{{ event.purefb_poll_error.error | pprint }}'
              target_array: '{{ event.purefb_poll_error.array | pprint }}'
    - name: Report poll errors without acting
      condition: event.purefb_poll_error is defined
      action:
        debug:
          msg: 'poll failed ({{ event.purefb_poll_error.signal }} on {{ event.purefb_poll_error.array }}): {{ event.purefb_poll_error.error }}'
    - name: Login by a human - check the source address against admin_cidrs
      condition: event.purefb_session.event is defined and event.purefb_session.event == "login" and event.purefb_session.user not in vars.automation_users
      throttle:
        once_within: 10 minutes
        group_by_attributes:
          - event.purefb_session.array
          - event.purefb_session.user
          - event.purefb_session.location
      action:
        run_job_template:
          name: FlashBlade - session check
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              target_array: '{{ event.purefb_session.array | pprint }}'
              session_id: '{{ event.purefb_session.session_id | pprint }}'
              session_user: '{{ event.purefb_session.user | pprint }}'
              session_location: '{{ event.purefb_session.location | pprint }}'
              session_method: '{{ event.purefb_session.method | pprint }}'
              session_interface: '{{ event.purefb_session.user_interface | pprint }}'
              session_start_time: '{{ event.purefb_session.start_time | pprint }}'
              admin_cidrs: '{{ admin_cidrs }}'
    - name: Repeated failed logins - notify
      condition: event.purefb_session.event is defined and event.purefb_session.event not in ["login", "logout"] and event.purefb_session.event_count >= vars.failed_login_count
      throttle:
        once_within: 30 minutes
        group_by_attributes:
          - event.purefb_session.array
          - event.purefb_session.user
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: '{{ (event.purefb_session.event_count ~ '' x '' ~ event.purefb_session.event ~ '' for '' ~ event.purefb_session.user ~ '' on '' ~ event.purefb_session.array) | pprint }}'
              detail: from {{ event.purefb_session.location }} via {{ event.purefb_session.method }} ({{ event.purefb_session.user_interface }}); session {{ event.purefb_session.session_id }}
              target_array: '{{ event.purefb_session.array | pprint }}'
    - name: Superuser password login or default password - notify
      condition: event.purefb_alert.code is defined and event.purefb_alert.code in [1140, 1123] and event.purefb_alert.transition in ["opened", "updated"]
      action:
        run_job_template:
          name: FlashBlade - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: '{{ (event.purefb_alert.array ~ '' alert '' ~ event.purefb_alert.code ~ '': '' ~ event.purefb_alert.summary) | pprint }}'
              detail: '{{ (event.purefb_alert.description ~ '' '' ~ event.purefb_alert.action) | pprint }}'
              target_array: '{{ event.purefb_alert.array | pprint }}'
              alert_id: '{{ event.purefb_alert.alert_id | pprint }}'
              alert_code: '{{ event.purefb_alert.code | pprint }}'
