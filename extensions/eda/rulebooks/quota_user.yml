#
# User and group quotas: the array raises alert 1106 when a user and 1107
# when a group reaches its quota on a file system. The alert names the file
# system and the principal; playbooks/user_quota.yml reads the quota and the
# usage behind it (/quotas/users and /usage/users take a file system name,
# so this is one read per alert, not a poll over every file system) and
# records them. With auto_raise_user_quota true the quota is raised by
# user_quota_step_pct up to user_quota_max_bytes (0 = never raise, ask);
# with it false the record is the notification and a human decides. The
# array e-mails the user itself when quotas/settings
# direct_notifications_enabled is on, so this is the operator's side.
# Alerts already open at start-up (transition initial) are not re-read.

- name: FlashBlade user and group quotas
  hosts: all

  sources:
    - sdodsley.flashblade_eda.purefb_events:
        arrays: "{{ purefb_arrays }}"
        signals: [alerts]
        alerts_interval: "{{ alerts_interval }}"

  rules:
    # A poll that fails once is a blip; one that keeps failing is an array
    # nobody is watching. The first failure of a streak is recorded at info
    # (the alert log; under the default Slack floor), once an hour per array
    # and signal, because health.yml already pages for the array itself and
    # nine rulebooks poll the same arrays; a streak the plugin flags as
    # escalated (poll_error_escalate, default 10 polls) pages at critical once
    # every six hours, since a signal that fails on its own is worth a page.
    # Anything in between is logged below.
    - name: Poll failing for many polls - escalate
      condition: >-
        event.purefb_poll_error is defined and
        event.purefb_poll_error.escalate == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefb_poll_error.array
          - event.purefb_poll_error.signal
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: critical
            subject: "{{ event.purefb_poll_error.array }} {{ event.purefb_poll_error.signal }} poll has failed {{ event.purefb_poll_error.consecutive }} times in a row"
            detail: "{{ event.purefb_poll_error.error }}"
            target_array: "{{ event.purefb_poll_error.array }}"
            alert_log: "{{ alert_log }}"

    - name: Poll failed - notify once
      condition: >-
        event.purefb_poll_error is defined and
        event.purefb_poll_error.consecutive == 1
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_poll_error.array
          - event.purefb_poll_error.signal
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: info
            subject: "{{ event.purefb_poll_error.array }} {{ event.purefb_poll_error.signal }} poll failed"
            detail: "{{ event.purefb_poll_error.error }}"
            target_array: "{{ event.purefb_poll_error.array }}"
            alert_log: "{{ alert_log }}"

    - name: Report poll errors without acting
      condition: event.purefb_poll_error is defined
      action:
        debug:
          msg: "poll failed ({{ event.purefb_poll_error.signal }} on {{ event.purefb_poll_error.array }}): {{ event.purefb_poll_error.error }}"

    - name: User or group quota reached - read the quota and usage, raise it when allowed
      condition: >-
        event.purefb_alert.code is defined and
        event.purefb_alert.code in [1106, 1107] and
        event.purefb_alert.transition in ["opened", "updated"] and
        event.purefb_alert.maintenance_active == false
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_alert.array
          - event.purefb_alert.alert_id
      action:
        run_playbook:
          name: playbooks/user_quota.yml
          extra_vars:
            target_array: "{{ event.purefb_alert.array }}"
            alert_id: "{{ event.purefb_alert.alert_id }}"
            alert_code: "{{ event.purefb_alert.code }}"
            severity: "{{ event.purefb_alert.severity }}"
            subject: "{{ event.purefb_alert.array }} alert {{ event.purefb_alert.code }}: {{ event.purefb_alert.summary }}"
            component_name: "{{ event.purefb_alert.component_name }}"
            alert_description: "{{ event.purefb_alert.description }}"
            alert_variables: "{{ event.purefb_alert.variables }}"
            array_action: "{{ event.purefb_alert.action }}"
            auto_raise_user_quota: "{{ auto_raise_user_quota }}"
            user_quota_step_pct: "{{ user_quota_step_pct }}"
            user_quota_max_bytes: "{{ user_quota_max_bytes }}"
            fb_api_version: "{{ fb_api_version }}"
            alert_log: "{{ alert_log }}"

    - name: Quota alert during a maintenance window - log only
      condition: >-
        event.purefb_alert.code is defined and
        event.purefb_alert.code in [1106, 1107] and
        event.purefb_alert.maintenance_active == true
      action:
        debug:
          msg: "maintenance window on {{ event.purefb_alert.array }}: quota alert {{ event.purefb_alert.code }} {{ event.purefb_alert.summary }} not read"
