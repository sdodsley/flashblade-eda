---
# Copyright 2026 Everpure, Inc.
# SPDX-License-Identifier: Apache-2.0
#
# Push path: FlashBlade syslog into the same policies, seconds after the
# fact. purity.audit lines carry the user, so change control can react to a
# human's action without waiting for the audit poll; purity.alert lines are
# the alert stream without polling. Both still need the REST plugin for the
# full record (alert variables, audit user agent), so this rulebook raises
# the fast notification and leaves the reconcile to change_control.yml.
#
# The data-audit service is the FlashBlade-only part: one JSON record per
# audited file operation (SMB from 4.4, NFS from 4.8.0). The plugin tallies
# them per file system, user and client and raises purefb_file_activity
# once per window when deletes, create+delete pairs or extension-changing
# renames reach a threshold; individual records are not acted on here,
# they are too many.
#
# Syslog carries no authentication: the listener binds to syslog_host and,
# when syslog_allowed_sources lists addresses or CIDR prefixes, drops
# anything from elsewhere (an empty list accepts any source). An array
# forwards its whole system log to a syslog target; the listener emits the
# programs in syslog_programs (the three Purity ones by default) and drops
# the rest, so the last rule only sees events when a site widens that list.
# Data-audit records have no program and always pass. The window length
# and thresholds are the plugin defaults (60 s, 100 deletes, 50 renames).

- name: FlashBlade syslog
  hosts: all

  sources:
    - sdodsley.flashblade_eda.purefb_syslog:
        host: "{{ syslog_host }}"
        port: "{{ syslog_port }}"
        allowed_sources: "{{ syslog_allowed_sources }}"
        programs: "{{ syslog_programs }}"
        hostnames: "{{ syslog_hostnames }}"
        automation_users: "{{ automation_users }}"

  rules:
    # The array repeats the alert's severity word on every state change, so a
    # closing alert arrives as CRITICAL too: the notification at the alert's
    # severity is for an open alert (or one whose line the layout did not
    # cover, state unknown); closed gets one notice at info and closing and
    # waiting to downgrade are logged, as alerts.yml does for the REST
    # transitions. The array repeats an open alert's line every quarter
    # hour for as long as it stays open, so the notification is held for a
    # day per alert: a repeat carries the same first-seen time, a re-opened
    # alert a new one.
    - name: Alert via syslog - notify
      condition: >-
        event.purefb_syslog_alert.severity in ["warning", "critical"] and
        event.purefb_syslog_alert.state not in ["closing", "closed", "waiting to downgrade"]
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefb_syslog_alert.array
          - event.purefb_syslog_alert.code
          - event.purefb_syslog_alert.subject
          - event.purefb_syslog_alert.first_seen
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: "{{ event.purefb_syslog_alert.severity }}"
            subject: >-
              {{ event.purefb_syslog_alert.array }} alert{{ (' ' ~ event.purefb_syslog_alert.code) if event.purefb_syslog_alert.code else '' }}{{ (' ' ~ event.purefb_syslog_alert.state) if event.purefb_syslog_alert.state else '' }}:
              {{ event.purefb_syslog_alert.subject | default(event.purefb_syslog_alert.message, true) }}
            detail: >-
              {{ event.purefb_syslog_alert.details | default('', true) }}
              {{ ('Action: ' ~ event.purefb_syslog_alert.action) if event.purefb_syslog_alert.action else '' }}
              {{ ('KB ' ~ event.purefb_syslog_alert.knowledge_base_url) if event.purefb_syslog_alert.knowledge_base_url else '' }}
              (syslog from {{ event.purefb_syslog_alert.source }},
              first seen {{ event.purefb_syslog_alert.first_seen | default(event.purefb_syslog_alert.time, true) }})
            alert_code: "{{ event.purefb_syslog_alert.code | default('', true) }}"
            target_array: "{{ event.purefb_syslog_alert.array }}"
            alert_log: "{{ alert_log }}"

    - name: Alert closed via syslog - notify
      condition: event.purefb_syslog_alert.state == "closed"
      throttle:
        once_within: 10 minutes
        group_by_attributes:
          - event.purefb_syslog_alert.array
          - event.purefb_syslog_alert.code
          - event.purefb_syslog_alert.subject
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: info
            subject: >-
              {{ event.purefb_syslog_alert.array }} alert{{ (' ' ~ event.purefb_syslog_alert.code) if event.purefb_syslog_alert.code else '' }} closed:
              {{ event.purefb_syslog_alert.subject | default(event.purefb_syslog_alert.message, true) }}
            detail: >-
              (syslog from {{ event.purefb_syslog_alert.source }},
              first seen {{ event.purefb_syslog_alert.first_seen | default(event.purefb_syslog_alert.time, true) }})
            alert_code: "{{ event.purefb_syslog_alert.code | default('', true) }}"
            target_array: "{{ event.purefb_syslog_alert.array }}"
            alert_log: "{{ alert_log }}"

    - name: Alert closing via syslog - log
      condition: event.purefb_syslog_alert.state in ["closing", "waiting to downgrade"]
      action:
        debug:
          msg: >-
            {{ event.purefb_syslog_alert.array }} alert {{ event.purefb_syslog_alert.code }}
            {{ event.purefb_syslog_alert.state }}: {{ event.purefb_syslog_alert.subject }}

    - name: Human action via syslog audit - fast notification
      condition: >-
        event.purefb_syslog_audit.by_automation == false and
        event.purefb_syslog_audit.user is defined and
        event.purefb_syslog_audit.command is defined
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: info
            subject: >-
              {{ event.purefb_syslog_audit.user }} on {{ event.purefb_syslog_audit.array }}:
              {{ event.purefb_syslog_audit.command }} {{ event.purefb_syslog_audit.subcommand | default('') }}
              {{ event.purefb_syslog_audit.arguments | default('') }}
            detail: >-
              {{ event.purefb_syslog_audit.user_interface | default('') }} from
              {{ event.purefb_syslog_audit.location | default('') }},
              audit {{ event.purefb_syslog_audit.audit_id | default('') }}
              at {{ event.purefb_syslog_audit.time | default('') }}
            target_array: "{{ event.purefb_syslog_audit.array }}"
            alert_log: "{{ alert_log }}"

    # The plugin raises this at most once per window per key, so the throttle
    # is only a guard against a storm that spans several windows.
    - name: File activity over threshold - notify
      condition: >-
        event.purefb_file_activity.mass_delete == true or
        event.purefb_file_activity.rename_storm == true
      throttle:
        once_within: 5 minutes
        group_by_attributes:
          - event.purefb_file_activity.array
          - event.purefb_file_activity.fs
          - event.purefb_file_activity.user
          - event.purefb_file_activity.client_ip
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: critical
            subject: >-
              {{ event.purefb_file_activity.user }} from {{ event.purefb_file_activity.client_ip }}
              on {{ event.purefb_file_activity.array }}/{{ event.purefb_file_activity.fs }}:
              {{ 'mass delete' if event.purefb_file_activity.mass_delete else 'rename storm' }}
            detail: >-
              {{ event.purefb_file_activity.deletes }} deletes,
              {{ event.purefb_file_activity.create_delete_pairs }} create+delete pairs,
              {{ event.purefb_file_activity.renames }} extension-changing renames
              in {{ event.purefb_file_activity.window_seconds }} s over {{ event.purefb_file_activity.proto }}
              (thresholds {{ event.purefb_file_activity.mass_delete_threshold }} / {{ event.purefb_file_activity.rename_storm_threshold }});
              last paths {{ event.purefb_file_activity.sample_paths | join(', ') }}
            target_array: "{{ event.purefb_file_activity.array }}"
            alert_log: "{{ alert_log }}"

    - name: Test message - log
      condition: event.purefb_syslog_test is defined
      action:
        debug:
          msg: "syslog path from {{ event.purefb_syslog_test.array }} is working: {{ event.purefb_syslog_test.message }}"

    - name: Anything else from the array - log
      condition: event.purefb_syslog_other is defined
      action:
        debug:
          msg: "unparsed syslog from {{ event.purefb_syslog_other.source }}: {{ event.purefb_syslog_other.raw }}"
