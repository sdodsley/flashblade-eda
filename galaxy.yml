---
# Copyright 2026 Everpure, Inc.
# SPDX-License-Identifier: Apache-2.0
#
# The repository root is the Ansible collection sdodsley.flashblade_eda: the
# three event source plugins (extensions/eda/plugins/event_source), the
# eleven modules (plugins/modules: the object-audit trio and the
# telemetry, maintenance, QoS, session, legal hold, alert flag and
# eradication modules), the rulebooks (extensions/eda/rulebooks)
# and the playbooks (playbooks/, with tasks/) are already laid out as
# collection content. `make collection` builds the
# tarball into build/ and installs it under ./collections, which env.sh puts
# first on ANSIBLE_COLLECTIONS_PATH. Everything else in the tree (tests,
# docs, the Prometheus material under prometheus/, the developer tools under
# tools/, local tooling) is development material and stays out of the
# artifact through build_ignore.
namespace: sdodsley
name: flashblade_eda
version: 0.1.2
readme: README.md
authors:
  - sdodsley
description: >-
  Event-Driven Ansible for Everpure FlashBlade: event source plugins,
  rulebooks and playbooks
license:
  - Apache-2.0
tags:
  - eda
  - storage
  - flashblade
  - everpure
  - purestorage
dependencies:
  ansible.eda: ">=2.13.0"
  everpure.flashblade: ">=1.29.0"
repository: https://github.com/sdodsley/flashblade-eda
documentation: https://github.com/sdodsley/flashblade-eda/blob/main/README.md
homepage: https://github.com/sdodsley/flashblade-eda
issues: https://github.com/sdodsley/flashblade-eda/issues
# Kept in the artifact: extensions/, plugins/, playbooks/, meta/, README.md, LICENSE.
build_ignore:
  - .git
  - .github
  - .gitignore
  - .pytest_cache
  - .yamllint
  - CHANGELOG.md
  - CONTRIBUTING.md
  - Makefile
  - SECURITY.md
  - aap
  - baseline
  - build
  - collections
  - context
  - decision-environment
  - docs
  - env.example
  - env.sh
  - inventory
  - orchestrator
  - prometheus
  - requirements.txt
  - requirements.yml
  - run.sh
  - scripts
  - slack
  - tests
  - tools
  - vars
  - venv
  - __pycache__
  - "*/__pycache__"
  - "*.pyc"
  - "*.tar.gz"
