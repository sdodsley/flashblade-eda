#
# Route an array alert through the alert-code runbook map and raise a
# ticket record carrying the array's own action text and KB link.
#
# The alerts rulebook passes the alert fields plus `alert_runbooks` (a map of
# alert code, as a string, -> {severity, route, note}). The entry is looked
# up by code, then `default`. `route` is one of:
#   notify   -> alert log only (same shape as notify.yml)
#   ticket   -> alert log + a ticket record; swap the lineinfile for
#               servicenow.itsm.incident or jira when connected
#   tasks    -> also include runbooks/<code>.yml from beside this playbook
#               (ansible-rulebook copies the playbook's whole directory into
#               its project dir, so the relative path resolves)
# FlashBlade codes 1000-1099 are system alerts (blades, drives, evacuation,
# NTP), 1100-1199 the customer-controlled ones (quotas, certificates,
# directory services, syslog, passwords); every alert carries action text
# and the link https://support.purestorage.com/?cid=Alert_<code>.
- name: Alert runbook
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Pick the runbook entry for this alert code, else the default
      ansible.builtin.set_fact:
        runbook: "{{ alert_runbooks[alert_code | string] | default(alert_runbooks['default']) }}"

    # Only the per-code tasks can touch the array (they read
    # hostvars[target_array] for tasks/fb_rest.yml or delegate a module to
    # it); a notify or ticket route needs nothing.
    - name: Resolve this array's credentials (inventory, per-array credential or fleet credential)
      when: runbook.route == 'tasks' and target_array in hostvars
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/resolve_array.yml"
      vars:
        resolve_array_name: "{{ target_array }}"

    - name: Build the record
      ansible.builtin.set_fact:
        alert_record:
          time: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
          kind: "{{ 'ticket' if runbook.route in ['ticket', 'tasks'] else 'notify' }}"
          severity: "{{ runbook.severity | default(severity) | string }}"
          array: "{{ target_array | string }}"
          alert_id: "{{ alert_id | string }}"
          alert_code: "{{ alert_code }}"
          transition: "{{ transition | default('opened') }}"
          subject: "{{ subject | string }}"
          component: "{{ ('' if (component | default(none)) is none else component) | string }}"
          description: "{{ ('' if (alert_description | default(none)) is none else alert_description) | string }}"
          array_action: "{{ ('' if (array_action | default(none)) is none else array_action) | string }}"
          knowledge_base_url: "{{ ('' if (knowledge_base_url | default(none)) is none else knowledge_base_url) | string }}"
          runbook_note: "{{ runbook.note | default('') }}"
          route: "{{ runbook.route }}"

    - name: Append to the alert log
      ansible.builtin.lineinfile:
        path: "{{ alert_log }}"
        create: true
        mode: "0600"
        line: "{{ alert_record | to_json }}"

    - name: Run the per-code runbook tasks
      when: runbook.route == 'tasks'
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/runbooks/{{ alert_code }}.yml"

    - name: Show the record
      ansible.builtin.debug:
        msg: >-
          [{{ alert_record.severity | upper }}] {{ alert_record.route }} :: {{ alert_record.subject }} ::
          {{ alert_record.array_action }} {{ alert_record.knowledge_base_url }} {{ alert_record.runbook_note }}
