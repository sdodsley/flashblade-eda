#
# The rule that protects the rule: keep the object audit log flowing.
# Called by the object audit rulebook with target_array, mode (quota |
# reattach), reason, audit_baseline, log_bucket_quota_step_pct,
# log_bucket_quota_max_bytes, audit_auto_reattach, fb_api_version, alert_log
# and, from the health event, log_bucket, log_bucket_used_bytes,
# log_bucket_quota_bytes, log_bucket_used_pct, uncovered_buckets,
# policies_disabled and members_without_filters.
#   quota     the log bucket is near its quota: raise the quota by
#             log_bucket_quota_step_pct, never above
#             log_bucket_quota_max_bytes (0 = notify only), with PATCH
#             /buckets {"quota_limit": "<bytes>"} through tasks/fb_rest.yml
#             (the array wants the figure as a string). A full log bucket
#             drops audit records, which nothing recovers.
#   reattach  a bucket has no enabled audit policy, a policy is disabled, a
#             member bucket has no filter, or a human detached something:
#             with audit_auto_reattach true the three modules
#             (purefb_log_target, purefb_audit_policy,
#             purefb_bucket_audit_filter) make the array match
#             audit_baseline; otherwise the record says what they would do.
# One critical record of kind auditor_guard is written whatever happens,
# naming the reason (the human and the command, when the audit record is
# what fired it).
- name: Guard the audit configuration
  hosts: "{{ target_array }}"
  gather_facts: false
  vars:
    guard_bucket: "{{ log_bucket | default(audit_baseline.log_bucket) | string }}"
  tasks:
    - name: Resolve this array's credentials (inventory, per-array credential or fleet credential)
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/resolve_array.yml"
      vars:
        resolve_array_name: "{{ inventory_hostname }}"

    - name: Refuse a host pattern that is not exactly this array, or another array's credential
      ansible.builtin.assert:
        that:
          - inventory_hostname == target_array
          - credential_array is not defined or credential_array == inventory_hostname
        fail_msg: >-
          target_array {{ target_array | string | truncate(80) }} is a host pattern, not one inventory array,
          or the attached credential ({{ credential_array | default('') }}) is for another array

    # The bucket, policy and log target names go into query strings and
    # module arguments.
    - name: Refuse an unknown mode or a baseline without plain names
      ansible.builtin.assert:
        that:
          - mode in ['quota', 'reattach']
          - audit_baseline is mapping
          - audit_baseline.log_bucket | default('') is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
          - audit_baseline.log_target | default('') is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
          - audit_baseline.policy | default('') is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
          - guard_bucket is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
        fail_msg: >-
          mode {{ mode | string | truncate(20) }} must be quota or reattach, and audit_baseline needs plain
          log_bucket, log_target and policy names

    - name: Start with nothing changed
      ansible.builtin.set_fact:
        changed_objects: []
        outcome: ""

    - name: Raise the log bucket quota
      when: mode == 'quota'
      block:
        - name: Read the log bucket
          ansible.builtin.include_tasks:
            file: "{{ playbook_dir }}/tasks/fb_rest.yml"
          vars:
            fb_rest_method: GET
            fb_rest_path: "buckets?names={{ guard_bucket }}"
            fb_rest_ignore_errors: true

        - name: Keep what the array said
          ansible.builtin.set_fact:
            bucket_now: "{{ (fb_rest_json['items'] | default([{}]))[0] | default({}) }}"
            bucket_error: "{{ fb_rest_error | trim }}"

        # the new quota: one step up, rounded to a whole MiB, capped by the
        # ceiling; the array's own figure is stepped, not the event's
        - name: Work out the new quota
          ansible.builtin.set_fact:
            quota_now: "{{ bucket_now.quota_limit | default(0, true) | int }}"
            quota_ceiling: "{{ log_bucket_quota_max_bytes | default(0) | int }}"
            quota_stepped: >-
              {{ ((((bucket_now.quota_limit | default(0, true) | int) * (100 + (log_bucket_quota_step_pct | default(25) | int)))
                   / 100 / 1048576) | round(0, 'ceil') | int) * 1048576 }}

        - name: Decide the target quota and whether to raise
          ansible.builtin.set_fact:
            quota_new: "{{ ([quota_stepped | int, quota_ceiling | int] | min) if (quota_ceiling | int) > 0 else 0 }}"

        - name: Decide whether the raise is wanted
          ansible.builtin.set_fact:
            quota_raise_wanted: >-
              {{ bucket_now.name is defined and (quota_ceiling | int) > 0 and (quota_now | int) > 0
                 and (quota_new | int) > (quota_now | int) }}

        - name: Raise the quota
          when: quota_raise_wanted | bool
          ansible.builtin.include_tasks:
            file: "{{ playbook_dir }}/tasks/fb_rest.yml"
          vars:
            fb_rest_method: PATCH
            fb_rest_path: "buckets?names={{ guard_bucket }}"
            fb_rest_body: "{{ {'quota_limit': quota_new | string} }}"
            fb_rest_ignore_errors: true

        - name: Describe the quota outcome
          ansible.builtin.set_fact:
            changed_objects: "{{ [('bucket ' ~ guard_bucket) | string] if quota_raise_wanted | bool and (fb_rest_status | int) == 200 else [] }}"
            outcome: >-
              {{ (('log bucket ' ~ guard_bucket ~ ' not read: ' ~ bucket_error) if bucket_now.name is not defined
                  else 'notify only: log_bucket_quota_max_bytes is 0' if (quota_ceiling | int) == 0
                  else 'notify only: the bucket has no quota to step' if (quota_now | int) == 0
                  else ('notify only: quota ' ~ quota_now ~ ' bytes is already at the ceiling ' ~ quota_ceiling) if (quota_new | int) <= (quota_now | int)
                  else ('quota raised from ' ~ quota_now ~ ' to ' ~ quota_new ~ ' bytes') if (fb_rest_status | int) == 200
                  else ('quota raise refused by the array: ' ~ (fb_rest_error | trim))) | string }}

    - name: Re-attach the audit configuration from the baseline
      when: mode == 'reattach' and audit_auto_reattach | default(false) | bool
      block:
        - name: Make sure the log target is as the baseline says
          sdodsley.flashblade_eda.purefb_log_target:
            fb_url: "{{ fb_url }}"
            api_token: "{{ api_token }}"
            disable_warnings: true
            name: "{{ audit_baseline.log_target }}"
            bucket: "{{ audit_baseline.log_bucket }}"
            log_name_prefix: "{{ audit_baseline.log_name_prefix | default('audit-logs') }}"
            log_rotate: "{{ audit_baseline.log_rotate | default('15m') }}"
            state: present
          register: log_target_result
          ignore_errors: true

        - name: Make sure the policy is enabled, points at the log target and covers the baseline buckets
          sdodsley.flashblade_eda.purefb_audit_policy:
            fb_url: "{{ fb_url }}"
            api_token: "{{ api_token }}"
            disable_warnings: true
            name: "{{ audit_baseline.policy }}"
            enabled: true
            log_targets:
              - "{{ audit_baseline.log_target }}"
            buckets: "{{ audit_baseline.buckets | default([]) }}"
            state: present
          register: policy_result
          ignore_errors: true

        # filters are a bucket -> name -> {actions, s3_prefixes} map in the
        # baseline; the module takes one filter at a time
        - name: Lay the baseline filters out as one list
          ansible.builtin.set_fact:
            filter_plan: >-
              {%- set out = [] -%}
              {%- for b in (audit_baseline.filters | default({}) | dict2items) -%}
              {%- for f in (b.value | default({}) | dict2items) -%}
              {%- set _ = out.append({'bucket': b.key, 'name': f.key,
                                      'actions': f.value.actions | default([]),
                                      's3_prefixes': f.value.s3_prefixes | default([])}) -%}
              {%- endfor -%}
              {%- endfor -%}
              {{ out }}

        - name: Make sure every baseline filter is on its bucket
          sdodsley.flashblade_eda.purefb_bucket_audit_filter:
            fb_url: "{{ fb_url }}"
            api_token: "{{ api_token }}"
            disable_warnings: true
            bucket: "{{ item.bucket }}"
            name: "{{ item.name }}"
            actions: "{{ item.actions }}"
            s3_prefixes: "{{ item.s3_prefixes if (item.s3_prefixes | length) > 0 else omit }}"
            state: present
          loop: "{{ filter_plan }}"
          loop_control:
            label: "{{ item.bucket }}/{{ item.name }}"
          register: filter_results
          ignore_errors: true

        - name: Note what changed and what failed
          ansible.builtin.set_fact:
            changed_objects: >-
              {%- set out = [] -%}
              {%- if log_target_result.changed | default(false) -%}{%- set _ = out.append('log-target ' ~ audit_baseline.log_target) -%}{%- endif -%}
              {%- if policy_result.changed | default(false) -%}{%- set _ = out.append('policy ' ~ audit_baseline.policy) -%}{%- endif -%}
              {%- for r in filter_results.results | default([]) -%}
              {%- if r.changed | default(false) -%}{%- set _ = out.append('filter ' ~ r.item.bucket ~ '/' ~ r.item.name) -%}{%- endif -%}
              {%- endfor -%}
              {{ out }}
            reattach_errors: >-
              {%- set out = [] -%}
              {%- for r in [log_target_result, policy_result] + (filter_results.results | default([])) -%}
              {%- if r.failed | default(false) -%}{%- set _ = out.append(r.msg | default('failed') | string | truncate(160)) -%}{%- endif -%}
              {%- endfor -%}
              {{ out }}

        - name: Describe the re-attach outcome
          ansible.builtin.set_fact:
            outcome: >-
              re-attached from the baseline: {{ (changed_objects | join(', ')) if (changed_objects | length) > 0 else 'nothing to change' }}{{
              ('; errors: ' ~ (reattach_errors | join('; '))) if (reattach_errors | length) > 0 else '' }}

    - name: Describe what the baseline would restore
      when: mode == 'reattach' and not (audit_auto_reattach | default(false) | bool)
      ansible.builtin.set_fact:
        outcome: >-
          notify only: audit_auto_reattach is off; the baseline would make sure log target
          {{ audit_baseline.log_target }} writes to {{ audit_baseline.log_bucket }}, policy {{ audit_baseline.policy }}
          is enabled on {{ audit_baseline.buckets | default([]) | join(', ') }} and the filters
          {{ audit_baseline.filters | default({}) | to_json }} are in place

    - name: Record the guard action
      ansible.builtin.lineinfile:
        path: "{{ alert_log }}"
        create: true
        mode: "0600"
        line: >-
          {{ {'time': now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ'), 'kind': 'auditor_guard', 'severity': 'critical',
              'array': inventory_hostname, 'mode': mode, 'reason': reason | default('') | trim,
              'outcome': outcome | trim, 'changed_objects': changed_objects,
              'log_bucket': guard_bucket, 'log_bucket_used_bytes': log_bucket_used_bytes | default(''),
              'log_bucket_quota_bytes': log_bucket_quota_bytes | default(''),
              'log_bucket_used_pct': log_bucket_used_pct | default(''),
              'uncovered_buckets': uncovered_buckets | default([]), 'policies_disabled': policies_disabled | default(''),
              'members_without_filters': members_without_filters | default([]),
              'changed': (changed_objects | length) > 0} | to_json }}
      delegate_to: localhost

    - name: Show the outcome
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} auditor guard ({{ mode }}): {{ reason | default('') | trim }} :: {{ outcome | trim }}

    # Job artifacts for a workflow or orchestrator node that follows this one.
    - name: Publish the outcome as job artifacts
      ansible.builtin.set_stats:
        aggregate: false
        per_host: false
        data: >-
          {{ {'array': inventory_hostname, 'mode': mode, 'changed_objects': changed_objects,
              'outcome': outcome | trim, 'changed': (changed_objects | length) > 0} }}
      run_once: true
      delegate_to: localhost
