#
# A user (alert 1106) or group (1107) reached its quota on a file system.
# The alert names the file system (variables "File System Name" on Purity//FB
# 4.6.4; component_name is "users of <fs>") and only counts the principals
# in each usage band, so the playbook lists that file system's quotas
# (/quotas/users or /quotas/groups, whose items carry quota and usage) and
# takes every principal at or above user_quota_warn_pct of its quota as the
# subject: it records quota and usage per principal and, when
# auto_raise_user_quota is true, raises each quota by user_quota_step_pct,
# never above user_quota_max_bytes (0 = never raise: the record is the
# notification and a human decides). The raise uses purefb_userquota or
# purefb_groupquota (quota in MiB). Called by the quota_user rulebook with
# target_array, alert_id, alert_code, component_name, alert_variables,
# subject, auto_raise_user_quota, user_quota_step_pct, user_quota_max_bytes
# and alert_log.
- name: User or group quota reached
  hosts: "{{ target_array }}"
  gather_facts: false
  vars:
    is_group: "{{ alert_code | int == 1107 }}"
    kind_word: "{{ 'groups' if alert_code | int == 1107 else 'users' }}"
    warn_pct: "{{ user_quota_warn_pct | default(80) | int }}"
    record_time: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
  tasks:
    - name: Resolve this array's credentials (inventory, per-array credential or fleet credential)
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/resolve_array.yml"
      vars:
        resolve_array_name: "{{ inventory_hostname }}"

    - name: Refuse a host pattern that is not exactly this array, or another array's credential
      ansible.builtin.assert:
        that:
          - inventory_hostname == target_array
          - credential_array is not defined or credential_array == inventory_hostname
        fail_msg: >-
          target_array {{ target_array | string | truncate(80) }} is a host pattern, not one inventory array,
          or the attached credential ({{ credential_array | default('') }}) is for another array

    # "File System Name" is the key the lab array uses (1101 uses FileSystemName);
    # the component_name "users of <fs>" / "groups of <fs>" is the fallback.
    - name: Work out the file system the alert names
      ansible.builtin.set_fact:
        quota_fs: >-
          {{ (alert_variables | default({}))['File System Name']
             | default((alert_variables | default({})).FileSystemName
                       | default((component_name | default('')) | regex_replace('^(users|groups) of ', ''), true), true)
             | trim }}

    - name: Decide whether the alert can be read back
      ansible.builtin.set_fact:
        identified: "{{ quota_fs is match('^[A-Za-z0-9][A-Za-z0-9_.:-]*$') }}"

    - name: Record an alert whose file system could not be identified
      when: not identified | bool
      ansible.builtin.lineinfile:
        path: "{{ alert_log }}"
        create: true
        mode: "0600"
        line: >-
          {{ {'time': record_time, 'kind': 'user_quota', 'severity': 'warning',
              'array': inventory_hostname, 'alert_id': alert_id | string, 'alert_code': alert_code,
              'file_system': quota_fs, 'principal': '', 'principal_kind': 'group' if is_group | bool else 'user',
              'outcome': 'file system not identified from the alert: ' ~ (subject | default('')),
              'variables': alert_variables | default({})} | to_json }}
      delegate_to: localhost

    - name: Stop when there is nothing to read
      when: not identified | bool
      ansible.builtin.meta: end_play

    # one call lists every quota on the file system with its usage; the alert
    # itself never names the principal
    - name: Read the quotas and usage of the file system
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/fb_rest.yml"
      vars:
        fb_rest_method: GET
        fb_rest_path: "quotas/{{ kind_word }}?file_system_names={{ quota_fs }}"
        fb_rest_ignore_errors: true

    - name: Keep the quotas
      ansible.builtin.set_fact:
        quota_items: "{{ fb_rest_json['items'] | default([]) }}"
        quota_error: "{{ fb_rest_error | trim }}"

    - name: Pick the principals at or above the warning share of their quota
      ansible.builtin.set_fact:
        over_quota: >-
          {%- set out = [] -%}
          {%- for q in quota_items -%}
          {%- set quota = q.quota | default(0) | int -%}
          {%- set usage = q.usage | default(0) | int -%}
          {%- set who = (q.group if is_group | bool else q.user) | default({}) -%}
          {%- if quota > 0 and (usage * 100 / quota) >= (warn_pct | int) -%}
          {%- set _ = out.append({
                'principal': (who.name | default(who.id, true)) | string,
                'principal_is_id': (who.name | default('', true)) == '',
                'quota_bytes': quota, 'usage_bytes': usage,
                'percentage_used': ((usage * 100 / quota) | round(1))}) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ out }}

    - name: Record an alert with no principal at or above the warning share
      when: over_quota | length == 0
      ansible.builtin.lineinfile:
        path: "{{ alert_log }}"
        create: true
        mode: "0600"
        line: >-
          {{ {'time': record_time, 'kind': 'user_quota', 'severity': 'info',
              'array': inventory_hostname, 'alert_id': alert_id | string, 'alert_code': alert_code,
              'file_system': quota_fs, 'principal': '', 'principal_kind': 'group' if is_group | bool else 'user',
              'outcome': 'no ' ~ kind_word ~ ' at or above ' ~ warn_pct ~ '% of an explicit quota (' ~ quota_items | length ~ ' quotas read)',
              'error': quota_error} | to_json }}
      delegate_to: localhost

    - name: Stop when nobody is over
      when: over_quota | length == 0
      ansible.builtin.meta: end_play

    # the new quota: one step up, rounded to a whole MiB, capped by the ceiling
    - name: Plan the raise for each principal
      ansible.builtin.set_fact:
        plan: >-
          {%- set out = [] -%}
          {%- set ceiling = user_quota_max_bytes | default(0) | int -%}
          {%- set step = user_quota_step_pct | default(25) | int -%}
          {%- for p in over_quota -%}
          {%- set stepped = (((p.quota_bytes * (100 + step)) / 100 / 1048576) | round(0, 'ceil') | int) * 1048576 -%}
          {%- set new = ([stepped, ceiling] | min) if ceiling > 0 else p.quota_bytes -%}
          {%- set _ = out.append(p | combine({
                'new_quota_bytes': new,
                'raise': (auto_raise_user_quota | default(false) | bool) and ceiling > 0 and new > p.quota_bytes})) -%}
          {%- endfor -%}
          {{ out }}

    - name: Raise the user quotas
      when: not is_group | bool and item.raise | bool
      everpure.flashblade.purefb_userquota:
        fb_url: "{{ fb_url }}"
        api_token: "{{ api_token }}"
        disable_warnings: true
        name: "{{ quota_fs }}"
        quota: "{{ ((item.new_quota_bytes | int) / 1048576) | int }}M"
        uid: "{{ (item.principal | int) if item.principal_is_id | bool else omit }}"
        uname: "{{ item.principal if not item.principal_is_id | bool else omit }}"
      loop: "{{ plan }}"
      loop_control:
        label: "{{ item.principal }}"
      register: user_raised

    - name: Raise the group quotas
      when: is_group | bool and item.raise | bool
      everpure.flashblade.purefb_groupquota:
        fb_url: "{{ fb_url }}"
        api_token: "{{ api_token }}"
        disable_warnings: true
        name: "{{ quota_fs }}"
        quota: "{{ ((item.new_quota_bytes | int) / 1048576) | int }}M"
        gid: "{{ (item.principal | int) if item.principal_is_id | bool else omit }}"
        gname: "{{ item.principal if not item.principal_is_id | bool else omit }}"
      loop: "{{ plan }}"
      loop_control:
        label: "{{ item.principal }}"
      register: group_raised

    - name: Note which raises changed the array
      ansible.builtin.set_fact:
        raised_by: >-
          {%- set m = {} -%}
          {%- for r in (user_raised.results | default([])) + (group_raised.results | default([])) -%}
          {%- if r.item is defined and r.changed | default(false) -%}{%- set _ = m.update({r.item.principal: true}) -%}{%- endif -%}
          {%- endfor -%}
          {{ m }}

    - name: Record the quota and usage of each principal
      ansible.builtin.lineinfile:
        path: "{{ alert_log }}"
        create: true
        mode: "0600"
        line: >-
          {{ {'time': record_time, 'kind': 'user_quota',
              'severity': 'warning' if raised_by[item.principal] | default(false) else 'info',
              'array': inventory_hostname, 'alert_id': alert_id | string, 'alert_code': alert_code,
              'file_system': quota_fs, 'principal': item.principal,
              'principal_kind': 'group' if is_group | bool else 'user',
              'quota_bytes': item.quota_bytes, 'usage_bytes': item.usage_bytes,
              'percentage_used': item.percentage_used,
              'raised': raised_by[item.principal] | default(false),
              'new_quota_bytes': item.new_quota_bytes if raised_by[item.principal] | default(false) else 0,
              'outcome': ('quota raised to ' ~ item.new_quota_bytes ~ ' bytes') if raised_by[item.principal] | default(false)
                         else 'read only: auto_raise_user_quota is off' if not (auto_raise_user_quota | default(false) | bool)
                         else 'read only: user_quota_max_bytes is 0 (ask)' if (user_quota_max_bytes | default(0) | int) == 0
                         else 'read only: already at the ceiling',
              'error': quota_error} | to_json }}
      loop: "{{ plan }}"
      loop_control:
        label: "{{ item.principal }}"
      delegate_to: localhost

    - name: Show the outcome
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}/{{ quota_fs }} {{ kind_word }} at or above {{ warn_pct }}%:
          {% for p in plan %}{{ p.principal }} usage {{ p.usage_bytes }} of {{ p.quota_bytes }} bytes
          ({{ p.percentage_used }}%){{ ' -> raised to ' ~ p.new_quota_bytes if raised_by[p.principal] | default(false) else '' }}{{ '; ' if not loop.last else '' }}{% endfor %}
          {{ quota_error }}

    - name: Publish the outcome as job artifacts
      ansible.builtin.set_stats:
        aggregate: false
        per_host: false
        data: >-
          {{ {'array': inventory_hostname, 'file_system': quota_fs, 'principal_kind': 'group' if is_group | bool else 'user',
              'principals': plan | map(attribute='principal') | list,
              'raised': raised_by.values() | select | list | length} }}
      run_once: true
      delegate_to: localhost
