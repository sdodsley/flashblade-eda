#
# Prometheus alerting rules for a FlashBlade that pushes OTLP metrics into
# Prometheus's OTLP receiver (Purity//FB 4.6.4, REST 2.21; prometheus/README.md
# says how). Generated by tools/telemetry_rules.py from the array's own
# telemetry-metrics-policies rules listing: 12 policies, 35 metrics;
# array label device_name; silence floor 10 minutes; arrays fb-a. Regenerate
# rather than edit the silence rules; the hand-written rules at the end are
# the template in the script.
#
# Nothing is scraped, so there is no `up == 0`: silence is the signal. For
# every policy one FlashBladeTelemetrySilent alert fires when the policy's
# first metric has been absent for twice the policy's resolution or the
# floor, whichever is longer. absent_over_time keeps only the labels its
# selector pins, so each silence rule names one array. Alertmanager hands
# every alert to ansible.eda.alertmanager; extensions/eda/rulebooks/alertmanager.yml
# routes by alertname and reads array_name, which every alert sets from
# the array label. Thresholds are deliberately conservative; tune them per
# site. FlashBladeCapacityHigh puts the bare percentage in annotations.value
# for the rulebook; summary is the sentence for humans.
#
# verify: the metric names are the listing's dotted names with underscores
# (storage.device.iops -> storage_device_iops), which the
# UnderscoreEscapingWithSuffixes strategy produces for a metric without a
# unit. verify: device_name is taken to be the resource attribute that names the
# array (promoted to a label by promote_all_resource_attributes). The
# attributes of the space and health series are unverified until a receiver
# sees them; the rules that use them say so.
groups:
  - name: flashblade-telemetry-silence
    rules:
      - alert: FlashBladeTelemetrySilent
        # bucket_client_perf_metrics: 2 metrics every 600 s, watched through storage.device.bucket.client.latency_us;
        # the window is twice the resolution or the 10 minute floor
        expr: absent_over_time(storage_device_bucket_client_latency_us{device_name="fb-a"}[20m])
        labels:
          severity: critical
          domain: telemetry
          policy: bucket_client_perf_metrics
          array_name: "{{ $labels.device_name }}"
        annotations:
          summary: "{{ $labels.device_name }} has pushed nothing for policy bucket_client_perf_metrics (storage_device_bucket_client_latency_us) in 20 minutes: dead array, dead network, a disabled target or a receiver fault"

      - alert: FlashBladeTelemetrySilent
        # bucket_perf_metrics: 4 metrics every 600 s, watched through storage.device.bucket.bw_bpo;
        # the window is twice the resolution or the 10 minute floor
        expr: absent_over_time(storage_device_bucket_bw_bpo{device_name="fb-a"}[20m])
        labels:
          severity: critical
          domain: telemetry
          policy: bucket_perf_metrics
          array_name: "{{ $labels.device_name }}"
        annotations:
          summary: "{{ $labels.device_name }} has pushed nothing for policy bucket_perf_metrics (storage_device_bucket_bw_bpo) in 20 minutes: dead array, dead network, a disabled target or a receiver fault"

      - alert: FlashBladeTelemetrySilent
        # bucket_space_metrics: 3 metrics every 600 s, watched through storage.device.bucket.obj_count;
        # the window is twice the resolution or the 10 minute floor
        expr: absent_over_time(storage_device_bucket_obj_count{device_name="fb-a"}[20m])
        labels:
          severity: critical
          domain: telemetry
          policy: bucket_space_metrics
          array_name: "{{ $labels.device_name }}"
        annotations:
          summary: "{{ $labels.device_name }} has pushed nothing for policy bucket_space_metrics (storage_device_bucket_obj_count) in 20 minutes: dead array, dead network, a disabled target or a receiver fault"

      - alert: FlashBladeTelemetrySilent
        # device_client_perf_metrics: 4 metrics every 600 s, watched through storage.device.client.bw_bpo;
        # the window is twice the resolution or the 10 minute floor
        expr: absent_over_time(storage_device_client_bw_bpo{device_name="fb-a"}[20m])
        labels:
          severity: critical
          domain: telemetry
          policy: device_client_perf_metrics
          array_name: "{{ $labels.device_name }}"
        annotations:
          summary: "{{ $labels.device_name }} has pushed nothing for policy device_client_perf_metrics (storage_device_client_bw_bpo) in 20 minutes: dead array, dead network, a disabled target or a receiver fault"

      - alert: FlashBladeTelemetrySilent
        # device_connector_metrics: 3 metrics every 60 s, watched through storage.device.connector.bw_bps;
        # the window is twice the resolution or the 10 minute floor
        expr: absent_over_time(storage_device_connector_bw_bps{device_name="fb-a"}[10m])
        labels:
          severity: critical
          domain: telemetry
          policy: device_connector_metrics
          array_name: "{{ $labels.device_name }}"
        annotations:
          summary: "{{ $labels.device_name }} has pushed nothing for policy device_connector_metrics (storage_device_connector_bw_bps) in 10 minutes: dead array, dead network, a disabled target or a receiver fault"

      - alert: FlashBladeTelemetrySilent
        # device_perf_metrics: 4 metrics every 60 s, watched through storage.device.bw_bpo;
        # the window is twice the resolution or the 10 minute floor
        expr: absent_over_time(storage_device_bw_bpo{device_name="fb-a"}[10m])
        labels:
          severity: critical
          domain: telemetry
          policy: device_perf_metrics
          array_name: "{{ $labels.device_name }}"
        annotations:
          summary: "{{ $labels.device_name }} has pushed nothing for policy device_perf_metrics (storage_device_bw_bpo) in 10 minutes: dead array, dead network, a disabled target or a receiver fault"

      - alert: FlashBladeTelemetrySilent
        # device_replication_perf_metrics: 1 metric every 600 s, watched through storage.device.repl.bw_bps;
        # the window is twice the resolution or the 10 minute floor
        expr: absent_over_time(storage_device_repl_bw_bps{device_name="fb-a"}[20m])
        labels:
          severity: critical
          domain: telemetry
          policy: device_replication_perf_metrics
          array_name: "{{ $labels.device_name }}"
        annotations:
          summary: "{{ $labels.device_name }} has pushed nothing for policy device_replication_perf_metrics (storage_device_repl_bw_bps) in 20 minutes: dead array, dead network, a disabled target or a receiver fault"

      - alert: FlashBladeTelemetrySilent
        # device_space_metrics: 2 metrics every 60 s, watched through storage.device.space_bytes;
        # the window is twice the resolution or the 10 minute floor
        expr: absent_over_time(storage_device_space_bytes{device_name="fb-a"}[10m])
        labels:
          severity: critical
          domain: telemetry
          policy: device_space_metrics
          array_name: "{{ $labels.device_name }}"
        annotations:
          summary: "{{ $labels.device_name }} has pushed nothing for policy device_space_metrics (storage_device_space_bytes) in 10 minutes: dead array, dead network, a disabled target or a receiver fault"

      - alert: FlashBladeTelemetrySilent
        # device_state_metrics: 3 metrics every 600 s, watched through storage.device.alerts;
        # the window is twice the resolution or the 10 minute floor
        expr: absent_over_time(storage_device_alerts{device_name="fb-a"}[20m])
        labels:
          severity: critical
          domain: telemetry
          policy: device_state_metrics
          array_name: "{{ $labels.device_name }}"
        annotations:
          summary: "{{ $labels.device_name }} has pushed nothing for policy device_state_metrics (storage_device_alerts) in 20 minutes: dead array, dead network, a disabled target or a receiver fault"

      - alert: FlashBladeTelemetrySilent
        # fs_perf_metrics: 4 metrics every 600 s, watched through storage.device.fs.bw_bpo;
        # the window is twice the resolution or the 10 minute floor
        expr: absent_over_time(storage_device_fs_bw_bpo{device_name="fb-a"}[20m])
        labels:
          severity: critical
          domain: telemetry
          policy: fs_perf_metrics
          array_name: "{{ $labels.device_name }}"
        annotations:
          summary: "{{ $labels.device_name }} has pushed nothing for policy fs_perf_metrics (storage_device_fs_bw_bpo) in 20 minutes: dead array, dead network, a disabled target or a receiver fault"

      - alert: FlashBladeTelemetrySilent
        # fs_space_metrics: 2 metrics every 600 s, watched through storage.device.fs.space_bytes;
        # the window is twice the resolution or the 10 minute floor
        expr: absent_over_time(storage_device_fs_space_bytes{device_name="fb-a"}[20m])
        labels:
          severity: critical
          domain: telemetry
          policy: fs_space_metrics
          array_name: "{{ $labels.device_name }}"
        annotations:
          summary: "{{ $labels.device_name }} has pushed nothing for policy fs_space_metrics (storage_device_fs_space_bytes) in 20 minutes: dead array, dead network, a disabled target or a receiver fault"

      - alert: FlashBladeTelemetrySilent
        # obj_store_account_space_metrics: 3 metrics every 600 s, watched through storage.device.obj_store_account.obj_count;
        # the window is twice the resolution or the 10 minute floor
        expr: absent_over_time(storage_device_obj_store_account_obj_count{device_name="fb-a"}[20m])
        labels:
          severity: critical
          domain: telemetry
          policy: obj_store_account_space_metrics
          array_name: "{{ $labels.device_name }}"
        annotations:
          summary: "{{ $labels.device_name }} has pushed nothing for policy obj_store_account_space_metrics (storage_device_obj_store_account_obj_count) in 20 minutes: dead array, dead network, a disabled target or a receiver fault"

  - name: flashblade-eda
    rules:
      # --- health ---------------------------------------------------------------
      - alert: FlashBladeHealthNotOk
        # verify: storage.device.health is taken to be a gauge with 1 = healthy
        expr: storage_device_health != 1
        for: 5m
        labels:
          severity: critical
          domain: health
          array_name: "{{ $labels.device_name }}"
        annotations:
          summary: "{{ $labels.device_name }} reports health {{ $value }}"

      # --- capacity -------------------------------------------------------------
      - alert: FlashBladeCapacityHigh
        # verify: the space series' attributes are unverified; the rule assumes a
        # space_type label whose values follow the REST /arrays/space fields
        # (total_physical used, capacity usable). Adjust it from the series the
        # receiver shows.
        expr: |
          100 * storage_device_space_bytes{space_type="total_physical"}
            / ignoring (space_type) storage_device_space_bytes{space_type="capacity"} > 85
        for: 15m
        labels:
          severity: warning
          domain: capacity
          array_name: "{{ $labels.device_name }}"
        annotations:
          summary: "{{ $labels.device_name }} is {{ $value | printf \"%.1f\" }}% full"
          value: "{{ $value | printf \"%.1f\" }}"

      # --- performance ----------------------------------------------------------
      - alert: FlashBladeLatencyHigh
        # 20 ms sustained for 10 minutes on the array-wide latency; a dimension
        # label, if the series carries one, arrives on the alert
        expr: storage_device_latency_us > 20000
        for: 10m
        labels:
          severity: warning
          domain: performance
          array_name: "{{ $labels.device_name }}"
        annotations:
          summary: "{{ $labels.device_name }} latency is {{ $value | printf \"%.0f\" }} us"

      # --- network --------------------------------------------------------------
      - alert: FlashBladeConnectorErrors
        # err_ps is already a per-second rate (a gauge), so the 5 minute average
        # rather than rate(), which expects a counter; the connector's own
        # attributes arrive as labels on the alert
        expr: avg_over_time(storage_device_connector_err_ps[5m]) > 0
        labels:
          severity: warning
          domain: health
          array_name: "{{ $labels.device_name }}"
        annotations:
          summary: "{{ $labels.device_name }} has a connector erroring at {{ $value | printf \"%.2f\" }}/s over 5 minutes"

      # --- replication ----------------------------------------------------------
      - alert: FlashBladeReplicationStalled
        # only meaningful on an array with a replica link; an array that
        # replicates nothing pushes zero (or nothing) and should silence this
        expr: storage_device_repl_bw_bps == 0
        for: 30m
        labels:
          severity: warning
          domain: replication
          array_name: "{{ $labels.device_name }}"
        annotations:
          summary: "{{ $labels.device_name }} has replicated nothing for 30 minutes"
