# SPDX-License-Identifier: Apache-2.0
#
# Replay a client hog, a hogging file system and a calm tarpitted file
# system through the containment rules, without fio on a real client.
#   { cat vars/local-lab.yml; \
#     sed "/^---$/d; /^#/d; s/REPLAY_ARRAY/<array>/; s/REPLAY_CLIENT/<client ip>/" tests/fixtures/contain.yml; } \
#     > tests/out/vars_replay.yml
#   FBEDA_VARS=tests/out/vars_replay.yml ./run.sh tests/replay_contain.yml
# Expected: with ir_auto_contain true one quarantine record naming the file
# systems whose export names the client (eda-demo-quota on the lab, made
# read-only; release it through the approvals webhook or by hand with
# action=release), else one critical notification; with ir_auto_tarpit true
# a tarpit record for eda-demo-quota (eda-tarpit created at
# tarpit_ops_per_sec and assigned; REST 2.17 or later) and a lift record
# for eda-dr-demo (not tarpitted on the array, so "not tarpitted" is
# recorded). The rules are copies of the ones in
# extensions/eda/rulebooks/contain.yml, throttles included; the approvals
# webhook ruleset is not replayed. tests/unit/test_rulebooks.py fails if a
# copy drifts.
- name: FlashBlade containment (replayed fixtures)
  hosts: all

  sources:
    - ansible.eda.generic:
        payload: "{{ fixture_events }}"
        loop_count: 1
        delay: 1

  rules:
    - name: Client holding the array - quarantine
      condition: >-
        event.purefb_client_performance.high_share_polls is defined and
        event.purefb_client_performance.high_share_polls >= vars.contain_consecutive_polls and
        event.purefb_client_performance.ops_share_pct >= vars.contain_min_share_pct and
        event.purefb_client_performance.baseline_known == true and
        event.purefb_client_performance.array_write_latency_ratio >= vars.baseline_latency_ratio and
        vars.ir_auto_contain == true
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_client_performance.array
          - event.purefb_client_performance.client
      action:
        run_playbook:
          name: playbooks/quarantine_client.yml
          extra_vars:
            target_array: "{{ event.purefb_client_performance.array }}"
            client: "{{ event.purefb_client_performance.client }}"
            file_system: ""
            action: quarantine
            reason: >-
              {{ event.purefb_client_performance.protocol }} client held {{ event.purefb_client_performance.ops_share_pct }}% of the ops
              (iops={{ event.purefb_client_performance.reads_per_sec }}r/{{ event.purefb_client_performance.writes_per_sec }}w)
              for {{ event.purefb_client_performance.high_share_polls }} polls while the array's write latency was
              {{ event.purefb_client_performance.array_write_latency_ratio }}x the same half hour last week
            contain_exclude_clients: "{{ contain_exclude_clients }}"
            contain_exclude_file_systems: "{{ contain_exclude_file_systems }}"
            fb_api_version: "{{ fb_api_version }}"
            alert_log: "{{ alert_log }}"

    - name: Client holding the array - notify
      condition: >-
        event.purefb_client_performance.high_share_polls is defined and
        event.purefb_client_performance.high_share_polls >= vars.contain_consecutive_polls and
        event.purefb_client_performance.ops_share_pct >= vars.contain_min_share_pct and
        event.purefb_client_performance.baseline_known == true and
        event.purefb_client_performance.array_write_latency_ratio >= vars.baseline_latency_ratio and
        vars.ir_auto_contain == false
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_client_performance.array
          - event.purefb_client_performance.client
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: critical
            subject: "Client {{ event.purefb_client_performance.client }} is holding {{ event.purefb_client_performance.ops_share_pct }}% of the ops on {{ event.purefb_client_performance.array }}"
            detail: >-
              iops={{ event.purefb_client_performance.reads_per_sec }}r/{{ event.purefb_client_performance.writes_per_sec }}w
              write={{ event.purefb_client_performance.usec_per_write_op }}us
              for {{ event.purefb_client_performance.high_share_polls }} polls;
              array write={{ event.purefb_client_performance.array_usec_per_write_op }}us,
              {{ event.purefb_client_performance.array_write_latency_ratio }}x the same half hour last week;
              ir_auto_contain is off
            target_array: "{{ event.purefb_client_performance.array }}"
            alert_log: "{{ alert_log }}"

    - name: File system hogging - tarpit
      condition: >-
        event.purefb_fs_performance.high_share_polls is defined and
        event.purefb_fs_performance.high_share_polls >= vars.contain_consecutive_polls and
        event.purefb_fs_performance.ops_share_pct >= vars.contain_min_share_pct and
        event.purefb_fs_performance.eda_capped == false and
        event.purefb_fs_performance.eda_tarpit == false and
        vars.ir_auto_tarpit == true
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefb_fs_performance.array
          - event.purefb_fs_performance.file_system
      action:
        run_playbook:
          name: playbooks/tarpit.yml
          extra_vars:
            target_array: "{{ event.purefb_fs_performance.array }}"
            file_system: "{{ event.purefb_fs_performance.file_system }}"
            action: apply
            tarpit_ops_per_sec: "{{ tarpit_ops_per_sec }}"
            reason: >-
              iops={{ event.purefb_fs_performance.reads_per_sec }}r/{{ event.purefb_fs_performance.writes_per_sec }}w
              ({{ event.purefb_fs_performance.ops_share_pct }}% of the array) for {{ event.purefb_fs_performance.high_share_polls }} polls
            fb_api_version: "{{ fb_api_version }}"
            alert_log: "{{ alert_log }}"

    - name: Tarpitted file system calm - lift
      condition: >-
        event.purefb_fs_performance.eda_tarpit is defined and
        event.purefb_fs_performance.eda_tarpit == true and
        event.purefb_fs_performance.normal_polls >= vars.contain_release_normal_polls
      throttle:
        once_within: 10 minutes
        group_by_attributes:
          - event.purefb_fs_performance.array
          - event.purefb_fs_performance.file_system
      action:
        run_playbook:
          name: playbooks/tarpit.yml
          extra_vars:
            target_array: "{{ event.purefb_fs_performance.array }}"
            file_system: "{{ event.purefb_fs_performance.file_system }}"
            action: lift
            tarpit_ops_per_sec: "{{ tarpit_ops_per_sec }}"
            reason: "share normal for {{ event.purefb_fs_performance.normal_polls }} polls"
            fb_api_version: "{{ fb_api_version }}"
            alert_log: "{{ alert_log }}"
