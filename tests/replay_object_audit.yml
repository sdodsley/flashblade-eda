# SPDX-License-Identifier: Apache-2.0
#
# Replay recorded object audit events through the object audit rules: a
# canary read, a landing marker, an evidence object, a denied-storm rollup
# and a log bucket near its quota, without waiting for a rotation window.
#   { cat vars/local-lab.yml; sed "/^---$/d; /^#/d; s/REPLAY_ARRAY/<array>/" tests/fixtures/object_audit.yml; } \
#     > tests/out/vars_replay.yml
#   FBEDA_VARS=tests/out/vars_replay.yml ./run.sh tests/replay_object_audit.yml
# Expected: a canary record (the key PSFBSAZRTESTKEY0001 does not exist on
# the array, so with canary_auto_disable_key true the disable is refused by
# the array and recorded; with it false a critical notification), a landing
# record (landing_command run when set), a legal_hold record (the object
# must exist in eda-data for the hold to be placed; otherwise the refusal
# is recorded), an s3_anomaly record for the denied storm and an
# auditor_guard record for the quota (raised only with
# log_bucket_quota_max_bytes above the bucket's quota). The rules are copies
# of the ones in extensions/eda/rulebooks/object_audit.yml, throttles
# included, and the ruleset matches every rule an event satisfies as the
# real one does; tests/unit/test_rulebooks.py fails if a copy drifts.
- name: FlashBlade object audit (replayed fixtures)
  hosts: all
  match_multiple_rules: true

  sources:
    - ansible.eda.generic:
        payload: "{{ fixture_events }}"
        loop_count: 1
        delay: 1
      filters:
        - sdodsley.flashblade_eda.jinja_safe:

  rules:
    - name: Canary object read by a key not on the allow-list - disable the key
      condition: >-
        event.purefb_s3_event.canary is defined and
        event.purefb_s3_event.canary == true and
        event.purefb_s3_event.canary_allowed == false and
        event.purefb_s3_event.by_automation == false and
        vars.canary_auto_disable_key == true
      throttle:
        once_within: 10 minutes
        group_by_attributes:
          - event.purefb_s3_event.array
          - event.purefb_s3_event.access_key_id
      action:
        run_playbook:
          name: playbooks/canary.yml
          extra_vars:
            target_array: "{{ event.purefb_s3_event.array }}"
            access_key_id: "{{ event.purefb_s3_event.access_key_id }}"
            user: "{{ event.purefb_s3_event.user }}"
            bucket: "{{ event.purefb_s3_event.bucket }}"
            key: "{{ event.purefb_s3_event.key }}"
            source_ip: "{{ event.purefb_s3_event.source_ip }}"
            event_time: "{{ event.purefb_s3_event.event_time }}"
            log_object: "{{ event.purefb_s3_event.log_object }}"
            canary_readers: "{{ canary_readers }}"
            automation_keys: "{{ automation_keys }}"
            fb_api_version: "{{ fb_api_version }}"
            alert_log: "{{ alert_log }}"

    - name: Canary object read by a key not on the allow-list - notify
      condition: >-
        event.purefb_s3_event.canary is defined and
        event.purefb_s3_event.canary == true and
        event.purefb_s3_event.canary_allowed == false and
        event.purefb_s3_event.by_automation == false and
        vars.canary_auto_disable_key == false
      throttle:
        once_within: 10 minutes
        group_by_attributes:
          - event.purefb_s3_event.array
          - event.purefb_s3_event.access_key_id
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: critical
            subject: "Canary {{ event.purefb_s3_event.bucket }}/{{ event.purefb_s3_event.key }} read by {{ event.purefb_s3_event.user }} ({{ event.purefb_s3_event.access_key_id }}) on {{ event.purefb_s3_event.array }}"
            detail: >-
              {{ event.purefb_s3_event.event_name }} from {{ event.purefb_s3_event.source_ip }}
              at {{ event.purefb_s3_event.event_time }}, agent {{ event.purefb_s3_event.user_agent }};
              canary_auto_disable_key is off; log object {{ event.purefb_s3_event.log_object }}
            target_array: "{{ event.purefb_s3_event.array }}"
            alert_log: "{{ alert_log }}"

    - name: Landing marker arrived - start the ingest
      condition: >-
        event.purefb_s3_event.landing is defined and
        event.purefb_s3_event.landing == true and
        vars.landing_enabled == true
      throttle:
        once_within: 5 minutes
        group_by_attributes:
          - event.purefb_s3_event.array
          - event.purefb_s3_event.dataset
      action:
        run_playbook:
          name: playbooks/landing.yml
          extra_vars:
            target_array: "{{ event.purefb_s3_event.array }}"
            bucket: "{{ event.purefb_s3_event.bucket }}"
            key: "{{ event.purefb_s3_event.key }}"
            dataset: "{{ event.purefb_s3_event.dataset }}"
            user: "{{ event.purefb_s3_event.user }}"
            access_key_id: "{{ event.purefb_s3_event.access_key_id }}"
            source_ip: "{{ event.purefb_s3_event.source_ip }}"
            event_time: "{{ event.purefb_s3_event.event_time }}"
            landing_command: "{{ landing_command }}"
            alert_log: "{{ alert_log }}"

    - name: Evidence object arrived - legal hold
      condition: >-
        event.purefb_s3_event.evidence is defined and
        event.purefb_s3_event.evidence == true and
        event.purefb_s3_event.by_automation == false and
        vars.legal_hold_on_arrival == true
      action:
        run_playbook:
          name: playbooks/lock_on_arrival.yml
          extra_vars:
            target_array: "{{ event.purefb_s3_event.array }}"
            bucket: "{{ event.purefb_s3_event.bucket }}"
            key: "{{ event.purefb_s3_event.key }}"
            version_id: "{{ event.purefb_s3_event.version_id }}"
            user: "{{ event.purefb_s3_event.user }}"
            access_key_id: "{{ event.purefb_s3_event.access_key_id }}"
            source_ip: "{{ event.purefb_s3_event.source_ip }}"
            event_time: "{{ event.purefb_s3_event.event_time }}"
            object_store: "{{ object_store }}"
            alert_log: "{{ alert_log }}"

    - name: Access-denied storm - notify or disable the key
      condition: >-
        event.purefb_s3_rollup.denied_storm is defined and
        event.purefb_s3_rollup.denied_storm == true
      throttle:
        once_within: 30 minutes
        group_by_attributes:
          - event.purefb_s3_rollup.array
          - event.purefb_s3_rollup.top_access_key
      action:
        run_playbook:
          name: playbooks/s3_anomaly.yml
          extra_vars:
            target_array: "{{ event.purefb_s3_rollup.array }}"
            access_key_id: "{{ event.purefb_s3_rollup.top_access_key }}"
            kind: denied_storm
            window: "{{ event.purefb_s3_rollup.window }}"
            log_object: "{{ event.purefb_s3_rollup.log_object }}"
            record_count: "{{ event.purefb_s3_rollup.record_count }}"
            error_count: "{{ event.purefb_s3_rollup.error_count }}"
            error_pct: "{{ event.purefb_s3_rollup.error_pct }}"
            denied_count: "{{ event.purefb_s3_rollup.denied_count }}"
            top_access_key_count: "{{ event.purefb_s3_rollup.top_access_key_count }}"
            top_source_ip: "{{ event.purefb_s3_rollup.top_source_ip }}"
            by_error_code: "{{ event.purefb_s3_rollup.by_error_code }}"
            anomaly_auto_disable_key: "{{ anomaly_auto_disable_key }}"
            automation_keys: "{{ automation_keys }}"
            fb_api_version: "{{ fb_api_version }}"
            alert_log: "{{ alert_log }}"

    - name: Audit log bucket near its quota - raise it or page
      condition: >-
        event.purefb_audit_health.log_bucket_quota_known is defined and
        event.purefb_audit_health.log_bucket_quota_known == true and
        event.purefb_audit_health.log_bucket_used_pct >= vars.log_bucket_quota_warn_pct
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefb_audit_health.array
      action:
        run_playbook:
          name: playbooks/auditor_guard.yml
          extra_vars:
            target_array: "{{ event.purefb_audit_health.array }}"
            mode: quota
            reason: >-
              log bucket {{ event.purefb_audit_health.log_bucket }} at {{ event.purefb_audit_health.log_bucket_used_pct }}%
              of its quota ({{ event.purefb_audit_health.log_bucket_used_bytes }} of
              {{ event.purefb_audit_health.log_bucket_quota_bytes }} bytes, {{ event.purefb_audit_health.log_bucket_object_count }} objects)
            audit_baseline: "{{ audit_baseline }}"
            log_bucket_quota_step_pct: "{{ log_bucket_quota_step_pct }}"
            log_bucket_quota_max_bytes: "{{ log_bucket_quota_max_bytes }}"
            audit_auto_reattach: "{{ audit_auto_reattach }}"
            log_bucket: "{{ event.purefb_audit_health.log_bucket }}"
            log_bucket_used_bytes: "{{ event.purefb_audit_health.log_bucket_used_bytes }}"
            log_bucket_quota_bytes: "{{ event.purefb_audit_health.log_bucket_quota_bytes }}"
            log_bucket_used_pct: "{{ event.purefb_audit_health.log_bucket_used_pct }}"
            uncovered_buckets: "{{ event.purefb_audit_health.uncovered_buckets }}"
            policies_disabled: "{{ event.purefb_audit_health.policies_disabled }}"
            members_without_filters: "{{ event.purefb_audit_health.members_without_filters }}"
            fb_api_version: "{{ fb_api_version }}"
            alert_log: "{{ alert_log }}"

    - name: Audit rollup - log
      condition: event.purefb_s3_rollup.record_count is defined
      action:
        debug:
          msg: >-
            {{ event.purefb_s3_rollup.array }} {{ event.purefb_s3_rollup.log_object }}:
            {{ event.purefb_s3_rollup.record_count }} records, {{ event.purefb_s3_rollup.error_count }} errors
            ({{ event.purefb_s3_rollup.error_pct }}%), {{ event.purefb_s3_rollup.denied_count }} denied,
            {{ event.purefb_s3_rollup.delete_count }} deletes, canary {{ event.purefb_s3_rollup.canary_hits }},
            honey {{ event.purefb_s3_rollup.honey_hits }}; by event {{ event.purefb_s3_rollup.by_event_name }};
            top key {{ event.purefb_s3_rollup.top_access_key }} from {{ event.purefb_s3_rollup.top_source_ip }}
