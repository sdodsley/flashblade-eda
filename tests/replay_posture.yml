---
# Copyright 2026 Everpure, Inc.
# SPDX-License-Identifier: Apache-2.0
#
# Replay one recorded posture event through the posture rules: a public
# bucket, a world-open export rule, an old access key, an expiring
# certificate, a bucket without audit coverage and an open SMB share, all
# in one event, without waiting for the poll or weakening a lab array.
#   { cat vars/local-lab.yml; sed "/^---$/d; /^#/d; s/REPLAY_ARRAY/<array>/" tests/fixtures/posture.yml; } \
#     > tests/out/vars_replay.yml
#   FBEDA_VARS=tests/out/vars_replay.yml ./run.sh tests/replay_posture.yml
# Expected: five notify records at warning (one per finding) and the
# posture debug line; with posture_auto_revert true a posture_revert record
# instead of the public bucket notification (the bucket in the fixture must
# exist on the array for the module to change anything). The ruleset
# matches every rule the event satisfies, as the real one does. The rules
# are copies of the ones in extensions/eda/rulebooks/posture.yml, throttles
# included; tests/unit/test_rulebooks.py fails if a copy drifts.
- name: FlashBlade posture (replayed fixtures)
  hosts: all
  match_multiple_rules: true

  sources:
    - ansible.eda.generic:
        payload: "{{ fixture_events }}"
        loop_count: 1
        delay: 1

  rules:
    - name: Public bucket - block public access
      condition: >-
        event.purefb_posture.public_count is defined and
        event.purefb_posture.public_count > 0 and
        vars.posture_auto_revert == true
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefb_posture.array
      action:
        run_playbook:
          name: playbooks/posture_revert.yml
          extra_vars:
            target_array: "{{ event.purefb_posture.array }}"
            buckets: "{{ event.purefb_posture.public_buckets }}"
            alert_log: "{{ alert_log }}"

    - name: Public bucket - notify
      condition: >-
        event.purefb_posture.public_count is defined and
        event.purefb_posture.public_count > 0 and
        vars.posture_auto_revert == false
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefb_posture.array
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: warning
            subject: "{{ event.purefb_posture.public_count }} public bucket(s) on {{ event.purefb_posture.array }}"
            detail: "{{ event.purefb_posture.public_buckets }}; posture_auto_revert is off"
            target_array: "{{ event.purefb_posture.array }}"
            alert_log: "{{ alert_log }}"

    - name: World-open NFS export - notify
      condition: >-
        event.purefb_posture.world_open_export_count is defined and
        event.purefb_posture.world_open_export_count > 0
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefb_posture.array
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: warning
            subject: "{{ event.purefb_posture.world_open_export_count }} NFS export rule(s) grant * read-write on {{ event.purefb_posture.array }}"
            detail: "{{ event.purefb_posture.world_open_exports }}"
            target_array: "{{ event.purefb_posture.array }}"
            alert_log: "{{ alert_log }}"

    - name: Access key older than the limit - notify
      condition: >-
        event.purefb_posture.old_key_count is defined and
        event.purefb_posture.old_key_count > 0
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefb_posture.array
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: warning
            subject: "{{ event.purefb_posture.old_key_count }} object store access key(s) older than the limit on {{ event.purefb_posture.array }}"
            detail: "{{ event.purefb_posture.old_keys }}; {{ event.purefb_posture.disabled_key_count }} key(s) disabled"
            target_array: "{{ event.purefb_posture.array }}"
            alert_log: "{{ alert_log }}"

    - name: Certificate expiring - notify
      condition: >-
        event.purefb_posture.expiring_cert_count is defined and
        event.purefb_posture.expiring_cert_count > 0
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefb_posture.array
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: warning
            subject: "{{ event.purefb_posture.expiring_cert_count }} certificate(s) expiring on {{ event.purefb_posture.array }}"
            detail: "{{ event.purefb_posture.expiring_certs }} (days left; negative once expired)"
            target_array: "{{ event.purefb_posture.array }}"
            alert_log: "{{ alert_log }}"

    - name: Bucket without audit coverage - notify
      condition: >-
        event.purefb_posture.uncovered_count is defined and
        event.purefb_posture.uncovered_count > 0
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefb_posture.array
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: warning
            subject: "{{ event.purefb_posture.uncovered_count }} bucket(s) without an enabled audit policy on {{ event.purefb_posture.array }}"
            detail: "{{ event.purefb_posture.uncovered_buckets }}"
            target_array: "{{ event.purefb_posture.array }}"
            alert_log: "{{ alert_log }}"

    - name: SMB share open to everyone - notify
      condition: >-
        event.purefb_posture.smb_everyone_full_control_count is defined and
        event.purefb_posture.smb_everyone_full_control_count > 0
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefb_posture.array
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: warning
            subject: "{{ event.purefb_posture.smb_everyone_full_control_count }} SMB share policy(ies) grant Everyone full control on {{ event.purefb_posture.array }}"
            detail: "{{ event.purefb_posture.smb_everyone_full_control }}"
            target_array: "{{ event.purefb_posture.array }}"
            alert_log: "{{ alert_log }}"

    - name: Posture - log
      condition: event.purefb_posture.issue_count is defined
      action:
        debug:
          msg: >-
            posture {{ event.purefb_posture.array }} ({{ event.purefb_posture.purity_version }}):
            {{ event.purefb_posture.issue_count }} finding(s): public {{ event.purefb_posture.public_count }},
            uncovered {{ event.purefb_posture.uncovered_count }}, world-open exports {{ event.purefb_posture.world_open_export_count }},
            old keys {{ event.purefb_posture.old_key_count }}, expiring certificates {{ event.purefb_posture.expiring_cert_count }},
            SMB everyone {{ event.purefb_posture.smb_everyone_full_control_count }}
