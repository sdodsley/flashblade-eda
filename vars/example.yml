---
# Copyright 2026 Everpure, Inc.
# SPDX-License-Identifier: Apache-2.0
#
# Loaded by ansible-rulebook (--vars). Rulebooks forward what each playbook
# needs as extra_vars, because run_playbook copies the playbook's directory
# (playbooks/) into a temporary project; vars/ is not there, so relative
# vars_files paths do not resolve.
# Copy to vars/local-<site>.yml (gitignored) and edit. Comments give sane
# production values; the intervals set here are short, for a test run.
# Uppercase names in the rulebooks ({{ APPROVAL_TOKEN }},
# {{ GIT_WEBHOOK_SECRET }}) are environment variables handed over with
# --env-vars (run.sh does that), never keys in this file.

# --- arrays the source plugin polls ---------------------------------------
# name must match the inventory host name. Tokens and URLs come from the
# environment (api_token_env / fb_url_env) so this file holds no secrets.
# Every array listed here needs both variables set (see env.example); the
# plugin refuses to start otherwise. For a single array remove fb-b here and
# in the inventory.
purefb_arrays:
  - name: fb-a
    fb_url_env: FB_A_URL
    api_token_env: FB_A_TOKEN
  - name: fb-b
    fb_url_env: FB_B_URL
    api_token_env: FB_B_TOKEN

# Arrays polled by the config drift ruleset (one vars baseline per ruleset;
# copy the ruleset for arrays with a different baseline) and by the change
# control ruleset (baseline per array under baseline_dir).
config_arrays:
  - name: fb-a
    fb_url_env: FB_A_URL
    api_token_env: FB_A_TOKEN

# Every playbook appends one JSON line per action here (time, kind, severity,
# array, ...). Absolute path; the directory must exist and be writable by the
# rulebook user. The /var default needs root or a pre-created, chowned
# directory; for a local run point it somewhere under $HOME.
alert_log: /var/log/flashblade-eda/alerts.log

# --- polling intervals (seconds) ------------------------------------------
alerts_interval: 30          # production: 60
audits_interval: 15          # production: 15-60
sessions_interval: 60        # production: 60
health_interval: 60          # production: 300
telemetry_interval: 60       # production: 60-300
config_interval: 300         # production: 300-900

# --- config baseline for config_arrays ------------------------------------
# List-valued settings are sorted, comma-joined strings: the plugin emits
# them in that form so a rule compares with a single !=, and the remediation
# playbooks split them back into lists.
baseline_ntp_servers_csv: "0.pool.ntp.org,1.pool.ntp.org"
baseline_dns_domain: example.com
baseline_dns_nameservers_csv: "192.0.2.53,192.0.2.54"
# The management directory service (/directory-services name management);
# the NFS and SMB ones are not compared.
baseline_ds_management_enabled: true
baseline_ds_management_uris_csv: "ldaps://ldap.example.com"
baseline_ds_management_base_dn: "DC=example,DC=com"
# Whether the array is joined to Active Directory (any /active-directory
# account); a join or a leave is notified.
baseline_ad_joined: false
# /arrays eradication_config.manual_eradication: all-enabled means every
# destroyed object can be eradicated by hand; a hardened array reports
# all-disabled or partially-enabled and a longer delay.
baseline_manual_eradication: all-enabled
baseline_min_eradication_delay_ms: 86400000      # 24h; alert if shortened below
# Admin authentication baseline (notify-only rule). These are example
# hardened values, not factory defaults: set them to the site's own policy,
# because the rule fires whenever the array differs from what is written
# here (a weaker baseline than the array would warn on every poll after
# someone hardens it).
baseline_max_login_attempts: 5
baseline_lockout_duration_ms: 1800000            # 30 minutes
baseline_min_password_length: 12
baseline_sso_enabled: false
# Notify when no syslog server carries the data-audit service, that is when
# file-access audit records have nowhere to go. Off until a site has turned
# file auditing on.
require_data_audit_syslog: false

# --- thresholds -------------------------------------------------------------
capacity_risk_pct: 85
capacity_days_to_full_warning: 30
# Hard-limited file systems: the plugin emits purefb_fs_quota from warn_pct
# of the provisioned size; at grow_pct the capacity rulebook grows the file
# system by step_pct when fs_auto_grow is true, never above
# fs_grow_max_bytes (0 = always ask: a request is written instead) and never
# for a name matching one of the fs_grow_exclude globs (the Manila-managed
# shares by default, which Manila sizes itself).
fs_quota_warn_pct: 80
fs_quota_grow_pct: 90
fs_auto_grow: false
fs_grow_step_pct: 25
fs_grow_max_bytes: 0
fs_grow_exclude:
  - "share-*-manila"
# User and group quotas (alerts 1106 / 1107): raise by step_pct up to
# max_bytes when auto_raise_user_quota is true; 0 = never raise, ask.
auto_raise_user_quota: false
user_quota_step_pct: 25
user_quota_max_bytes: 0
baseline_latency_ratio: 2         # array write latency now vs the same half hour last week
# Clients and QoS (telemetry signal, client.yml): a client, file system or
# bucket holding this share of the array's ops for this many polls.
client_min_share_pct: 40
client_consecutive_polls: 3
client_actions_enabled: false     # run read-only diagnostics on the client's inventory host
qos_auto_cap: false               # file system or bucket hogging the array -> temporary QoS policy
qos_cap_ops_per_sec: 1000         # max_total_ops_per_sec of the eda-cap-<object> policy
qos_cap_min_share_pct: 40         # only objects holding at least this share of the array's ops
qos_lift_normal_polls: 5          # lift after this many consecutive normal polls

# Cooldowns live in the rulebooks as literal `throttle: once_within:` values;
# ansible-rulebook validates that field against its schema before variable
# substitution, so it cannot be templated from here.

# --- change control (audits signal) -----------------------------------------
# The identity the remediation playbooks authenticate as. Audit records by
# these users are logged, never reconciled. Use a dedicated service account.
automation_users:
  - svc-eda
# User agents that mark an audit record as automation whatever the user:
# the SDK the modules and the plugin use announces itself this way.
automation_user_agents:
  - pure/py-pure-client
# Commands whose audit record triggers a reconcile (or a notification for the
# ones the reconcile playbook does not rewrite).
governed_commands:
  - puredns
  - pureds
  - purearray
  - pureadmin
  - puresmtp
  - puresyslog
  - puresnmp
  - purealert
  - purepolicy
  - purelog
  - puremaintenance
# Human-run destructive subcommands on these commands are worth a
# notification in their own right (the data, the policies that protect it,
# the audit targets and the object store identities).
destructive_commands:
  - purefs
  - purebucket
  - purepolicy
  - purelog
  - pureobjaccount
  - pureobjuser
destructive_subcommands:
  - destroy
  - eradicate
  - delete
  - remove
  - disconnect
  - demote
# Checkout of the baseline repository (one <array>.yml per array with
# ntp_servers and dns), absolute path. A separate checkout, not this tree:
# apply_baseline.yml runs `git pull` in it.
baseline_dir: /opt/flashblade-eda-baseline
# Port the change control rulebook listens on for the git push webhook. The
# POST must carry X-Hub-Signature-256 (GitHub's hex HMAC-SHA256 of the body)
# made with the GIT_WEBHOOK_SECRET environment variable.
webhook_port: 5000

# --- alert runbooks (alerts signal) ---------------------------------------
# alert code (as a string) -> how to route it. Unknown codes use `default`.
# route: notify | ticket | tasks (ticket + include playbooks/runbooks/<code>.yml,
# found relative to the playbook; ansible-rulebook copies all of playbooks/)
alert_runbooks:
  default: {route: notify, note: ""}
  "1000": {route: ticket, severity: warning, note: "Blade unhealthy: health.yml lit its identify LED; open a case with the alert text."}
  "1016": {route: tasks, severity: critical, note: "Blade evacuation stuck for lack of space: runbooks/1016.yml records the blade and the array's space; free space through a capacity request."}
  "1019": {route: notify, note: "No qualified NTP server: config_drift.yml reapplies the baseline servers on its next poll if they differ."}
  "1101": {route: tasks, note: "File system space quota: runbooks/1101.yml records provisioned size and usage; capacity.yml grows it when fs_auto_grow is on."}
  "1108": {route: ticket, note: "Certificate expiring or expired: renew it (purefb_certs) before clients refuse the array."}
  "1112": {route: ticket, note: "Object replication connection requires attention: check the array connection and the remote credentials."}
  "1123": {route: ticket, note: "Default pureuser password still set: change it."}
  "1139": {route: tasks, severity: critical, note: "Syslog message drop (audit): runbooks/1139.yml lists the data-audit targets and runs the array's connectivity test."}
  "1140": {route: ticket, note: "Superuser logged in with a password: check the network access policy and who it was (sessions.yml)."}
# Flag a routed alert on the array (PATCH /alerts flagged): the array's own
# "automation has seen this" mark, visible in the GUI and the CLI.
alert_flag_handled: true

# --- capacity approvals and the orchestrator (telemetry signal) -------------
# Approval requests are written to request_dir (absolute path, writable by
# the rulebook user, same caveat as alert_log) and answered on the approvals
# webhook, which needs the APPROVAL_TOKEN environment variable as a bearer
# token:
#   curl -X POST http://<eda host>:<approval_port>/endpoint \
#        -H "Authorization: Bearer $APPROVAL_TOKEN" -H 'Content-Type: application/json' \
#        -d '{"request_id": "<id>", "approve": true, "approver": "jane", "action": "eradicate_pending"}'
request_dir: /var/lib/flashblade-eda/requests
approval_port: 5001
# Orchestrator handoff. When true, the capacity-at-risk rule posts the event
# to the automation orchestrator and the approval happens in a workflow
# there; the request file and the approvals webhook are not used for that
# rule. When false, the local approval path above runs unchanged. The
# service account credentials are the AO_CLIENT_ID / AO_CLIENT_SECRET
# environment variables (env.example), never keys here.
orchestrator_enabled: false
orchestrator_url: https://orchestrator.example.com
# webhook_path of the EDA trigger in the published workflow, one per route
# (the service account must be bound to each trigger, or the post gets 403).
orchestrator_paths:
  capacity: fb_capacity
orchestrator_validate_certs: true  # the orchestrator normally carries a real certificate
# When a capacity handoff fails (orchestrator down, token refused), raise the
# local request anyway so the approvals webhook can answer it. Off by default:
# on a platform the request file would live in a job's /tmp.
orchestrator_fallback_local: false

# --- maintenance windows (maintenance.yml) ---------------------------------
# The change-ticket webhook (bearer APPROVAL_TOKEN, as the approvals one):
#   curl -X POST http://<eda host>:<maintenance_port>/endpoint \
#        -H "Authorization: Bearer $APPROVAL_TOKEN" -H 'Content-Type: application/json' \
#        -d '{"array": "fb-a", "action": "open", "hours": 2, "requested_by": "jane"}'
maintenance_port: 5003
maintenance_default_hours: 4      # the array's own default; 1 to 48

# --- sessions (sessions.yml) -----------------------------------------------
# Networks a management login is expected from; a login from elsewhere is
# notified at warning. [] disables the check. IPv4 or IPv6 prefixes.
admin_cidrs: []
#  - 192.0.2.0/24
#  - 2001:db8::/48
failed_login_count: 3             # repeated non-login session events (failed attempts) before a notification

# --- push and zero-code paths ----------------------------------------------
# purefb_syslog listener (point the arrays' syslog target here, for example
# tcp://<this host>:5140; 514 needs root). The listener has no
# authentication: bind it to an interface the arrays reach and list the
# arrays' addresses in syslog_allowed_sources. An array forwards its whole
# management log and, with the data-audit service, every file-access audit
# record, so the listener keeps the Purity programs and drops the rest.
syslog_host: 0.0.0.0
syslog_port: 5140
syslog_allowed_sources: []       # [] = accept any sender; otherwise IPv4/IPv6 addresses or CIDR prefixes, e.g. ["192.0.2.0/24", "2001:db8::10"]
syslog_programs: [purity.alert, purity.audit, purity.test]   # programs emitted as events; [] or "all" passes every program through as kind other
syslog_hostnames: {}             # array name or syslog hostname -> inventory array name, when they differ
# ansible.eda.alertmanager listener for Prometheus rules fed by the array's
# OpenTelemetry push or the off-box exporter. The stock source has no token
# option: bind it to an interface only Alertmanager reaches, or put it
# behind the EDA controller's event streams / a reverse proxy that
# authenticates.
alertmanager_host: 0.0.0.0
alertmanager_port: 5002

# --- telemetry (telemetry_setup.yml, telemetry_check.yml, selftest.yml) -----
# The array pushes its metrics over OTLP to a Prometheus 3.x OTLP receiver
# (prometheus/README.md). playbooks/telemetry_setup.yml creates the target
# and attaches it to the metric policies listed; telemetry_endpoint empty
# leaves the telemetry checks inactive (selftest skips them). The endpoint
# has no scheme: "<host>:<port>[/<path>]", e.g. prom.example.com:9090/api/v1/otlp;
# the array opens a connection at creation and refuses an endpoint nothing
# listens on. telemetry_source is the array network interface the push
# leaves from (a data VIP name; the management interface is refused).
telemetry_target_name: eda-prom
telemetry_endpoint: ""
telemetry_source: ""
telemetry_transport: otlp-http-protobuf-without-tls   # a plain receiver; otlp-http-protobuf for TLS
telemetry_policies:                 # the array's 12 built-in telemetry-metrics policies
  - bucket_client_perf_metrics
  - bucket_perf_metrics
  - bucket_space_metrics
  - device_client_perf_metrics
  - device_connector_metrics
  - device_perf_metrics
  - device_replication_perf_metrics
  - device_space_metrics
  - device_state_metrics
  - fs_perf_metrics
  - fs_space_metrics
  - obj_store_account_space_metrics
# The silence rule in prometheus/flashblade.rules.yml fires when a policy's
# first metric has been absent for twice its resolution or this many
# minutes, whichever is larger (tools/telemetry_rules.py --silence-minutes).
telemetry_silence_minutes: 10
# The resource attribute Prometheus promotes as the array's name label; the
# rules file copies it into a fixed array_name label the alertmanager
# rulebook reads (tools/telemetry_rules.py --array-label).
telemetry_array_label: device_name
# The Prometheus server, http://host:9090; read by telemetry_check.yml (is
# the receiver answering?) and selftest.yml (/-/ready). "" skips both.
prometheus_url: ""

# --- object audit (object_audit.yml) ----------------------------------------
# The object-audit source tails the audit log bucket of each array listed
# here over S3 (boto3). Every credential is the name of an environment
# variable (env.example): the tail key reads the log bucket, the state key
# writes the cursor copy, requests, receipts and legal holds. The REST token
# is optional: with it the plugin reads the log target, the audit policies
# and the bucket quota (the REST fields of the health event); without it
# those fields are empty and the log key prefix must be discoverable.
object_audit_arrays:
  - name: fb-a
    fb_url_env: FB_A_URL
    api_token_env: FB_A_TOKEN
    s3_endpoint_env: FB_A_S3_ENDPOINT
    s3_access_key_env: FB_A_S3_ACCESS_KEY
    s3_secret_key_env: FB_A_S3_SECRET_KEY
    log_bucket: eda-log
    state_bucket: eda-state
    state_access_key_env: FB_A_S3_STATE_ACCESS_KEY
    state_secret_key_env: FB_A_S3_STATE_SECRET_KEY
# What the playbooks use to read and write objects on each array
# (playbooks/tasks/s3_object.yml): the same endpoint and keys, by
# environment variable name. access_key_env / secret_key_env are the tail
# (read) identity, the state keys write. An array missing here gets no legal
# holds, no S3 approvals and no request mirror.
object_store:
  fb-a:
    endpoint_env: FB_A_S3_ENDPOINT
    access_key_env: FB_A_S3_ACCESS_KEY
    secret_key_env: FB_A_S3_SECRET_KEY
    state_access_key_env: FB_A_S3_STATE_ACCESS_KEY
    state_secret_key_env: FB_A_S3_STATE_SECRET_KEY
    log_bucket: eda-log
    state_bucket: eda-state
object_audit_interval: 60         # seconds between listings; records arrive one rotation (5 min on the lab) after the request anyway
# Canary objects: a read of anything under these prefixes by a key not in
# canary_readers is a tripwire. With canary_auto_disable_key true the key is
# disabled on the array (playbooks/canary.yml); otherwise a critical notice.
canary_prefixes:
  - canary/
canary_readers: []                # access key ids allowed to read canaries (a backup or indexer identity)
canary_auto_disable_key: false
# Landing markers: a PutObject of one of landing_markers under a landing
# prefix means the dataset is complete. landing_command is a local command
# run with LANDING_ARRAY, LANDING_BUCKET, LANDING_KEY, LANDING_DATASET,
# LANDING_USER, LANDING_ACCESS_KEY_ID and LANDING_SOURCE_IP in its
# environment (no shell: write "sh -c '...'" for a pipeline); "" records
# the arrival and runs nothing.
landing_prefixes:
  - landing/
landing_markers:
  - _SUCCESS
  - manifest.json
landing_command: ""
# Evidence: a PutObject under these prefixes gets a legal hold with the
# state key when legal_hold_on_arrival is true (the bucket needs Object Lock
# enabled).
evidence_prefixes:
  - evidence/
legal_hold_on_arrival: true
# Approvals as objects: a PutObject of approvals/<request_id>.json into the
# log bucket ({"request_id": "<id>", "approve": true, "approver": "jane",
# "action": "grow_fs"}) runs the action the request proposed
# (playbooks/s3_approval.yml), which writes receipts/<request_id>.json.
# approval_keys lists the access key ids whose approvals count; [] accepts
# any key in the account that is not one of the automation's. With
# s3_requests_enabled true grow_fs.yml and capacity_request.yml also put the
# request to requests/<request_id>.json, so an approver can read what is
# proposed without reaching request_dir.
approval_prefix: approvals/
request_prefix: requests/
approval_keys: []
s3_requests_enabled: false
# Access key ids of the automation's own identities: never disabled by
# canary.yml or s3_anomaly.yml, never accepted as an approver. The plugin
# adds the keys listed here to its own tail and state keys (read from the
# environment) for its by_automation flag, so [] already covers those and
# the list is for extra writers; s3_approval.yml also reads the tail and
# state key ids from the environment through object_store.
automation_keys: []
# The size (bytes) an S3 approval may grow a file system to; 0 = whatever
# the request asked for. A request only exists for a target above
# fs_grow_max_bytes, so this is a second, higher ceiling.
fs_approval_max_bytes: 0
# Honey objects: any request naming a key with one of these suffixes.
honey_suffixes:
  - .secret
  - .key
  - .pem
# Storms are counted per log object (one rotation window on one blade
# authority): an error storm is error_min_count errors and error_rate_pct of
# the records in error; a denied storm denied_storm_count AccessDenied,
# SignatureDoesNotMatch, InvalidAccessKeyId or ExpiredToken records; a mass
# delete mass_delete_count deletes. With anomaly_auto_disable_key true a
# storm disables its top access key (playbooks/s3_anomaly.yml).
error_min_count: 5
error_rate_pct: 50
denied_storm_count: 5
mass_delete_count: 50
anomaly_auto_disable_key: false
# The log bucket's own quota: at warn_pct of it the auditor guard raises
# the quota by step_pct, up to log_bucket_quota_max_bytes (0 = notify only).
log_bucket_quota_warn_pct: 80
log_bucket_quota_step_pct: 25
log_bucket_quota_max_bytes: 0
# The audit configuration the guard restores (playbooks/auditor_guard.yml)
# when a bucket loses its audit policy, a policy is disabled or a human
# detaches something: with audit_auto_reattach true the three modules run
# from this baseline, otherwise the record says what they would do. Filter
# names are alphanumeric, 1 to 63 characters; log_rotate 5m to 24h.
audit_auto_reattach: false
audit_baseline:
  policy: eda-audit
  log_target: eda-audit
  log_bucket: eda-log
  log_name_prefix: audit_
  log_rotate: 5m
  buckets:
    - eda-data
    - eda-log
  filters:
    eda-data:
      edaall:
        actions: ["s3:All"]
    eda-log:
      edaapprovals:
        actions: ["s3:PutObject"]
        s3_prefixes: [approvals/, requests/]
# Buckets allowed to stay without an audit policy (globs): the state bucket
# is rewritten every poll and would only audit the automation itself.
coverage_exclude:
  - eda-state
# A log bucket that always has traffic can page when no log object arrives
# for stale_rotations rotations; off for a bucket that is quiet at night.
audit_log_expected_continuous: false
stale_rotations: 2

# --- posture (posture.yml) ---------------------------------------------------
# One read per poll of what a security review asks about: public buckets,
# world-open NFS exports, old access keys, expiring certificates, buckets
# without audit coverage, SMB shares open to Everyone. Each finding is
# notified once a day per array; posture_auto_revert true blocks public
# access on the public buckets instead (playbooks/posture_revert.yml,
# purefb_bucket block_public_access).
posture_interval: 900             # production: 900-3600
key_max_age_days: 90
cert_warn_days: 30
posture_auto_revert: false
posture_exclude_file_systems:     # legacy NFS rules of these file systems may stay world-open
  - "share-*-manila"

# --- replication and DR (replication.yml, housekeeping.yml) ------------------
# The replication signal reads the array connections, the S3 targets and
# every file system and bucket replica link each replication_interval. A
# link whose status is not in replication_ok_statuses is unhealthy; one
# whose lag is past replication_lag_warn_s is lagging; a streak of
# replication_escalate_polls polls escalates to critical.
replication_interval: 60          # production: 60-300
replication_lag_warn_s: 900
replication_ok_statuses:
  - replicating
  - idle
  - connected
  - healthy
replication_escalate_polls: 5
# A paused bucket replica link is resumed (purefb_bucket_replica paused
# false) when true; pausing is a human act, so off by default and a paused
# link is notified.
replication_auto_resume: false
# Scheduled DR drills (playbooks/dr_drill.yml, run by housekeeping.yml at
# dr_drill_hour UTC once a day): on the peer, promote the replica of
# file_system, read its space and export, demote it again. array and peer
# are inventory arrays; peer_file_system defaults to file_system;
# max_minutes bounds each wait. The link must exist already. A demote
# discards data written since the promotion only when dr_drill_discard is
# true (the drill writes nothing, so it stays false).
dr_drills: []
#  - array: fb-a
#    file_system: eda-dr-demo
#    peer: fb-b
#    peer_file_system: eda-dr-demo
#    max_minutes: 10
dr_drill_hour: 3
dr_drill_discard: false

# --- containment (contain.yml) -----------------------------------------------
# The brakes, each behind a switch and each reversible. A client holding
# contain_min_share_pct of the array's ops for contain_consecutive_polls
# while the array's write latency is baseline_latency_ratio times last
# week's is made read-only (ir_auto_contain); a file system in that state
# gets the eda-tarpit QoS policy at tarpit_ops_per_sec (ir_auto_tarpit),
# lifted after contain_release_normal_polls normal polls. Addresses in
# contain_exclude_clients (the automation's own hosts, backup servers) are
# never quarantined; file systems matching contain_exclude_file_systems are
# never touched. Releases, lock and session removal and manual tarpits
# arrive on the locks_port webhook with a bearer APPROVAL_TOKEN:
#   curl -X POST http://<eda host>:<locks_port>/endpoint \
#        -H "Authorization: Bearer $APPROVAL_TOKEN" -H 'Content-Type: application/json' \
#        -d '{"array": "fb-a", "action": "release", "client": "192.0.2.10", "approver": "jane"}'
ir_auto_contain: false
ir_auto_tarpit: false
tarpit_ops_per_sec: 100           # the array's minimum for max_total_ops_per_sec
contain_consecutive_polls: 3
contain_min_share_pct: 60
contain_release_normal_polls: 10
contain_exclude_clients: []
contain_exclude_file_systems:
  - "share-*-manila"
locks_port: 5004

# --- housekeeping (housekeeping.yml) -----------------------------------------
# One tick every housekeeping_interval seconds runs the selftest, the daily
# showback ledger and the DR drills (each playbook decides by the hour and
# the date whether there is anything to do).
housekeeping_interval: 3600
showback_enabled: true
showback_bucket: eda-state        # the ledger goes to this bucket of each array's object store
showback_prefix: showback/        # <prefix><yyyy-mm-dd>/<array>.json; drills mark <prefix>dr/<date>-<fs>.json
# Which selftest checks run: rest (GET /arrays), s3 (the state bucket
# answers), audit (the audit_baseline policy is enabled with members and
# filters), telemetry (the target exists and is enabled; skipped while
# telemetry_endpoint is empty), prometheus (<prometheus_url>/-/ready;
# skipped while empty).
selftest_checks: [rest, s3, audit, telemetry, prometheus]
# Expiring certificates (posture.yml): with certs_auto_renew true a
# self-signed array certificate within cert_warn_days of expiry is re-issued
# for certs_renew_days with its current names (playbooks/renew_certificate.yml);
# a CA-issued or external one is recorded as needing a human.
certs_auto_renew: false
certs_renew_days: 365

# --- REST ----------------------------------------------------------------
# REST version tasks/fb_rest.yml asks for where no collection module exists
# (alert flag, maintenance windows, quota usage). 2.16 is Purity//FB 4.5.2,
# the first with maintenance windows; the QoS playbooks ask for 2.17
